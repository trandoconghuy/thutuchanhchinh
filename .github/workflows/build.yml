    - name: Create Kotlin Source - Overlay 3D
      run: |
        cat << 'EOF' > app/src/main/java/com/example/cccdscanner/ScanOverlayView.kt
        package com.example.cccdscanner

        import android.animation.ValueAnimator
        import android.content.Context
        import android.graphics.Camera
        import android.graphics.Canvas
        import android.graphics.Color
        import android.graphics.LinearGradient
        import android.graphics.Matrix
        import android.graphics.Paint
        import android.graphics.Path
        import android.graphics.RectF
        import android.graphics.Shader
        import android.graphics.Typeface
        import android.hardware.Sensor
        import android.hardware.SensorEvent
        import android.hardware.SensorEventListener
        import android.hardware.SensorManager
        import android.os.SystemClock
        import android.util.AttributeSet
        import android.view.View
        import android.view.animation.LinearInterpolator
        import android.view.animation.OvershootInterpolator
        import androidx.core.graphics.ColorUtils
        import kotlin.math.PI
        import kotlin.math.cos
        import kotlin.math.max
        import kotlin.math.min
        import kotlin.math.sin
        import kotlin.random.Random

        /**
         * Lớp hiệu ứng quét 3D/4D:
         *  - Khung quét nghiêng theo cảm biến gia tốc (thị sai không gian) + 3 lớp khung chiều sâu
         *  - Tia quét phát sáng + hạt bụi sáng trôi ở nhiều độ sâu
         *  - Khi bắt được QR: khóa mục tiêu, khối hộp 3D nhô ra, sóng lan, dấu tích xanh
         */
        class ScanOverlayView @JvmOverloads constructor(
            context: Context,
            attrs: AttributeSet? = null
        ) : View(context, attrs), SensorEventListener {

            private val dp = resources.displayMetrics.density
            private val cyan = Color.parseColor("#00E5FF")
            private val green = Color.parseColor("#00E676")
            private val amber = Color.parseColor("#FFC107")

            var hint: String = "Đưa mã QR trên thẻ CCCD vào khung"

            private val frameRect = RectF()
            private val frameRadius = 26 * dp
            private var cx = 0f
            private var cy = 0f
            private var bandH = 90 * dp

            private fun makeStroke(w: Float) = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                style = Paint.Style.STROKE
                strokeWidth = w
                strokeCap = Paint.Cap.ROUND
                strokeJoin = Paint.Join.ROUND
            }

            private val glowPaint = makeStroke(11 * dp)
            private val bracketPaint = makeStroke(4.5f * dp)
            private val thinPaint = makeStroke(1.6f * dp)
            private val polyPaint = makeStroke(3.5f * dp)
            private val checkStroke = makeStroke(3.6f * dp)
            private val fillPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply { style = Paint.Style.FILL }
            private val dimPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply { style = Paint.Style.FILL; color = Color.BLACK }
            private val bandPaint = Paint(Paint.ANTI_ALIAS_FLAG)
            private val pillPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply { style = Paint.Style.FILL }
            private val textPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                color = Color.WHITE
                textSize = 14 * dp
                textAlign = Paint.Align.CENTER
                typeface = Typeface.create("sans-serif-medium", Typeface.NORMAL)
            }

            private val baseFramePath = Path()
            private val framePath = Path()
            private val dimPath = Path()
            private val bracketPath = Path()
            private val lockPath = Path()
            private val trackPath = Path()
            private val checkPath = Path()
            private val pillRect = RectF()

            private val camera = Camera()
            private val m3d = Matrix()
            private val overshoot = OvershootInterpolator(2.2f)

            // Hạt sáng nhiều độ sâu
            private val n = 28
            private val px = FloatArray(n)
            private val py = FloatArray(n)
            private val pz = FloatArray(n)
            private val ps = FloatArray(n)

            init {
                for (i in 0 until n) respawn(i, true)
                checkPath.moveTo(-9 * dp, 0f)
                checkPath.lineTo(-3 * dp, 7 * dp)
                checkPath.lineTo(10 * dp, -8 * dp)
            }

            private var phase = 0f
            private var rx = 0f
            private var ry = 0f
            private var tRx = 0f
            private var tRy = 0f
            private var lastT = 0L
            private var active = false
            private var sm: SensorManager? = null

            private var locked = false
            private var lockStart = 0L
            private val lockPts = FloatArray(8)
            private var lockCx = 0f
            private var lockCy = 0f
            private var lockSize = 0f

            private val trackBuf = FloatArray(8)
            private var hasTrack = false
            private var trackTime = 0L

            private val loop = ValueAnimator.ofFloat(0f, 1f).apply {
                duration = 2600
                repeatCount = ValueAnimator.INFINITE
                interpolator = LinearInterpolator()
                addUpdateListener {
                    phase = it.animatedValue as Float
                    step()
                    invalidate()
                }
            }

            private fun respawn(i: Int, anywhere: Boolean) {
                px[i] = Random.nextFloat()
                py[i] = if (anywhere) Random.nextFloat() else 1f
                pz[i] = Random.nextFloat()
                ps[i] = 0.05f + Random.nextFloat() * 0.12f
            }

            // ---------------- API công khai ----------------
            fun setActive(a: Boolean) {
                if (a == active) return
                active = a
                if (a) {
                    lastT = SystemClock.uptimeMillis()
                    if (!loop.isStarted) loop.start()
                    registerSensor()
                } else {
                    loop.cancel()
                    unregisterSensor()
                }
            }

            fun reset() {
                locked = false
                hasTrack = false
                invalidate()
            }

            fun lockOn(pts: FloatArray) {
                if (pts.size < 8) return
                for (i in 0 until 8) lockPts[i] = pts[i]
                lockPath.reset()
                lockPath.moveTo(lockPts[0], lockPts[1])
                for (i in 1..3) lockPath.lineTo(lockPts[2 * i], lockPts[2 * i + 1])
                lockPath.close()
                var sx = 0f
                var sy = 0f
                for (i in 0..3) { sx += lockPts[2 * i]; sy += lockPts[2 * i + 1] }
                lockCx = sx / 4f
                lockCy = sy / 4f
                var d = 0f
                for (i in 0..3) {
                    val dx = lockPts[2 * i] - lockCx
                    val dy = lockPts[2 * i + 1] - lockCy
                    d = max(d, kotlin.math.sqrt(dx * dx + dy * dy))
                }
                lockSize = max(d * 1.4f, 40 * dp)
                locked = true
                lockStart = SystemClock.uptimeMillis()
                invalidate()
            }

            fun track(pts: FloatArray) {
                if (pts.size < 8 || locked) return
                for (i in 0 until 8) trackBuf[i] = pts[i]
                hasTrack = true
                trackTime = SystemClock.uptimeMillis()
            }

            // ---------------- Cảm biến ----------------
            private fun registerSensor() {
                val mgr = context.getSystemService(Context.SENSOR_SERVICE) as? SensorManager ?: return
                sm = mgr
                val s = mgr.getDefaultSensor(Sensor.TYPE_ACCELEROMETER) ?: return
                mgr.registerListener(this, s, SensorManager.SENSOR_DELAY_GAME)
            }

            private fun unregisterSensor() {
                sm?.unregisterListener(this)
                sm = null
            }

            override fun onSensorChanged(e: SensorEvent) {
                tRy = (e.values[0] * 1.5f).coerceIn(-14f, 14f)
                tRx = (e.values[2] * 1.5f).coerceIn(-14f, 14f)
            }

            override fun onAccuracyChanged(sensor: Sensor?, accuracy: Int) {}

            override fun onDetachedFromWindow() {
                setActive(false)
                super.onDetachedFromWindow()
            }

            // ---------------- Bố cục ----------------
            override fun onSizeChanged(w: Int, h: Int, oldw: Int, oldh: Int) {
                super.onSizeChanged(w, h, oldw, oldh)
                val size = min(w, h) * 0.72f
                cx = w / 2f
                cy = h * 0.40f
                frameRect.set(cx - size / 2f, cy - size / 2f, cx + size / 2f, cy + size / 2f)

                baseFramePath.reset()
                baseFramePath.addRoundRect(frameRect, frameRadius, frameRadius, Path.Direction.CW)

                val l = frameRect.left
                val t = frameRect.top
                val r = frameRect.right
                val b = frameRect.bottom
                val len = 38 * dp
                val rad = frameRadius
                bracketPath.reset()
                bracketPath.moveTo(l, t + len); bracketPath.lineTo(l, t + rad); bracketPath.quadTo(l, t, l + rad, t); bracketPath.lineTo(l + len, t)
                bracketPath.moveTo(r - len, t); bracketPath.lineTo(r - rad, t); bracketPath.quadTo(r, t, r, t + rad); bracketPath.lineTo(r, t + len)
                bracketPath.moveTo(r, b - len); bracketPath.lineTo(r, b - rad); bracketPath.quadTo(r, b, r - rad, b); bracketPath.lineTo(r - len, b)
                bracketPath.moveTo(l + len, b); bracketPath.lineTo(l + rad, b); bracketPath.quadTo(l, b, l, b - rad); bracketPath.lineTo(l, b - len)

                bandPaint.shader = LinearGradient(
                    0f, 0f, 0f, bandH,
                    intArrayOf(ColorUtils.setAlphaComponent(cyan, 0), ColorUtils.setAlphaComponent(cyan, 150), ColorUtils.setAlphaComponent(cyan, 0)),
                    floatArrayOf(0f, 0.5f, 1f),
                    Shader.TileMode.CLAMP
                )
            }

            // ---------------- Vòng lặp ----------------
            private fun step() {
                val now = SystemClock.uptimeMillis()
                val dt = min(now - lastT, 50L) / 1000f
                lastT = now
                val a = (phase * 2 * PI).toFloat()
                rx += (tRx + sin(a) * 2.5f - rx) * 0.12f
                ry += (tRy + cos(a) * 2.5f - ry) * 0.12f
                for (i in 0 until n) {
                    py[i] -= ps[i] * dt
                    if (py[i] < 0f) respawn(i, false)
                }
            }

            private fun buildMatrix(z: Float) {
                camera.save()
                camera.rotateX(rx)
                camera.rotateY(ry)
                camera.translate(0f, 0f, z)
                camera.getMatrix(m3d)
                camera.restore()
                m3d.preTranslate(-cx, -cy)
                m3d.postTranslate(cx, cy)
            }

            // ---------------- Vẽ ----------------
            override fun onDraw(canvas: Canvas) {
                if (width == 0 || height == 0) return
                val now = SystemClock.uptimeMillis()
                val lockT = if (locked) min(1f, (now - lockStart) / 320f) else 0f
                val lp = if (locked) overshoot.getInterpolation(lockT) else 0f
                val lpc = min(1f, max(0f, lp))
                val accent = ColorUtils.blendARGB(cyan, green, lpc)
                val trackAlive = !locked && hasTrack && (now - trackTime) < 350L

                // 1) Nền tối khoét khung
                buildMatrix(0f)
                baseFramePath.transform(m3d, framePath)
                dimPath.reset()
                dimPath.fillType = Path.FillType.EVEN_ODD
                dimPath.addRect(0f, 0f, width.toFloat(), height.toFloat(), Path.Direction.CW)
                dimPath.addPath(framePath)
                dimPaint.alpha = (150 * (1f - lpc)).toInt()
                canvas.drawPath(dimPath, dimPaint)
                if (locked) {
                    dimPath.reset()
                    dimPath.fillType = Path.FillType.EVEN_ODD
                    dimPath.addRect(0f, 0f, width.toFloat(), height.toFloat(), Path.Direction.CW)
                    dimPath.addPath(lockPath)
                    dimPaint.alpha = (190 * lpc).toInt()
                    canvas.drawPath(dimPath, dimPaint)
                }

                // 2) Các lớp khung chiều sâu (hiệu ứng đường hầm 3D)
                val fade = 1f - 0.75f * lpc
                for (i in 3 downTo 1) {
                    buildMatrix(i * 26 * dp)
                    canvas.save()
                    canvas.concat(m3d)
                    thinPaint.color = accent
                    thinPaint.alpha = (110 * fade / i).toInt()
                    canvas.drawRoundRect(frameRect, frameRadius, frameRadius, thinPaint)
                    canvas.restore()
                }

                // 3) Lớp chính: viền, tia quét, hạt sáng, góc khung
                buildMatrix(0f)
                canvas.save()
                canvas.concat(m3d)
                thinPaint.color = accent
                thinPaint.alpha = 130
                canvas.drawRoundRect(frameRect, frameRadius, frameRadius, thinPaint)

                if (lpc < 1f) {
                    canvas.save()
                    canvas.clipPath(baseFramePath)
                    for (i in 0 until n) {
                        val z = pz[i]
                        val x = frameRect.left + px[i] * frameRect.width() + ry * (z - 0.5f) * dp * 1.2f
                        val y = frameRect.top + py[i] * frameRect.height() + rx * (z - 0.5f) * dp * 1.2f
                        val edge = sin(py[i] * PI).toFloat()
                        fillPaint.color = cyan
                        fillPaint.alpha = (255 * (0.15f + 0.55f * z) * edge * (1f - lpc)).toInt().coerceIn(0, 255)
                        canvas.drawCircle(x, y, (1f + 2.2f * z) * dp, fillPaint)
                    }
                    val pp = (0.5 - 0.5 * cos(phase * 2 * PI)).toFloat()
                    val y = frameRect.top - bandH / 2f + frameRect.height() * pp
                    canvas.translate(frameRect.left, y)
                    bandPaint.alpha = (255 * (1f - lpc)).toInt()
                    canvas.drawRect(0f, 0f, frameRect.width(), bandH, bandPaint)
                    thinPaint.color = Color.WHITE
                    thinPaint.alpha = (200 * (1f - lpc)).toInt()
                    canvas.drawLine(0f, bandH / 2f, frameRect.width(), bandH / 2f, thinPaint)
                    canvas.restore()
                }

                glowPaint.color = accent
                glowPaint.alpha = 70
                canvas.drawPath(bracketPath, glowPaint)
                bracketPaint.color = accent
                bracketPaint.alpha = 255
                canvas.drawPath(bracketPath, bracketPaint)
                canvas.restore()

                // 4) QR lạ (không phải CCCD): khung vàng theo dõi
                if (trackAlive) {
                    trackPath.reset()
                    trackPath.moveTo(trackBuf[0], trackBuf[1])
                    for (i in 1..3) trackPath.lineTo(trackBuf[2 * i], trackBuf[2 * i + 1])
                    trackPath.close()
                    glowPaint.color = amber
                    glowPaint.alpha = 70
                    canvas.drawPath(trackPath, glowPaint)
                    polyPaint.color = amber
                    polyPaint.alpha = 255
                    canvas.drawPath(trackPath, polyPaint)
                }

                // 5) Hiệu ứng khóa mục tiêu 3D
                if (locked) drawLock(canvas, now, lp, lpc)

                // 6) Nhãn hướng dẫn
                val label = when {
                    locked -> "Đã nhận diện!"
                    trackAlive -> "Đây không phải mã QR trên CCCD"
                    else -> hint
                }
                val tw = textPaint.measureText(label)
                val padX = 18 * dp
                val ph = 38 * dp
                val top = frameRect.bottom + 30 * dp
                pillRect.set(cx - tw / 2f - padX, top, cx + tw / 2f + padX, top + ph)
                pillPaint.color = if (locked) ColorUtils.setAlphaComponent(green, 200) else Color.argb(150, 0, 0, 0)
                canvas.drawRoundRect(pillRect, ph / 2f, ph / 2f, pillPaint)
                val ty = top + ph / 2f - (textPaint.descent() + textPaint.ascent()) / 2f
                canvas.drawText(label, cx, ty, textPaint)
            }

            private fun drawLock(canvas: Canvas, now: Long, lp: Float, lpc: Float) {
                // Khối hộp 3D: mặt sau lệch theo độ nghiêng
                val ex = (12 * dp + ry * 0.8f * dp) * lp
                val ey = (-12 * dp + rx * 0.8f * dp) * lp

                canvas.save()
                canvas.translate(ex, ey)
                thinPaint.color = green
                thinPaint.alpha = 120
                canvas.drawPath(lockPath, thinPaint)
                canvas.restore()

                thinPaint.color = green
                thinPaint.alpha = 140
                for (i in 0..3) {
                    canvas.drawLine(lockPts[2 * i], lockPts[2 * i + 1], lockPts[2 * i] + ex, lockPts[2 * i + 1] + ey, thinPaint)
                }

                // Mặt trước
                fillPaint.color = green
                fillPaint.alpha = (60 * lpc).toInt()
                canvas.drawPath(lockPath, fillPaint)
                glowPaint.color = green
                glowPaint.alpha = 80
                canvas.drawPath(lockPath, glowPaint)
                polyPaint.color = green
                polyPaint.alpha = 255
                canvas.drawPath(lockPath, polyPaint)

                // Đỉnh
                fillPaint.color = Color.WHITE
                fillPaint.alpha = 255
                for (i in 0..3) canvas.drawCircle(lockPts[2 * i], lockPts[2 * i + 1], 4.5f * dp * lpc, fillPaint)

                // Sóng lan
                val rt = ((now - lockStart) % 900L) / 900f
                thinPaint.color = green
                thinPaint.alpha = (160 * (1f - rt)).toInt()
                canvas.drawCircle(lockCx, lockCy, lockSize * (0.3f + 1.1f * rt), thinPaint)

                // Dấu tích
                fillPaint.color = green
                fillPaint.alpha = 255
                canvas.drawCircle(lockCx, lockCy, 22 * dp * max(0f, lp), fillPaint)
                canvas.save()
                canvas.translate(lockCx, lockCy)
                canvas.scale(max(0f, lp), max(0f, lp))
                checkStroke.color = Color.WHITE
                canvas.drawPath(checkPath, checkStroke)
                canvas.restore()
            }
        }
