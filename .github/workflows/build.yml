name: Build Android APK V13

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Restore Keystore Cache
      uses: actions/cache@v4
      with:
        path: ~/.android/debug.keystore
        key: android-debug-keystore-v1

    - name: Generate Keystore
      run: |
        if [ ! -f ~/.android/debug.keystore ]; then
          mkdir -p ~/.android
          keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
        fi

    # ------------------------------------------------------------------
    # 1) CẤU HÌNH GRADLE + MANIFEST
    # ------------------------------------------------------------------
    - name: Create Gradle Config
      run: |
        mkdir -p app/src/main/java/com/example/cccdscanner
        mkdir -p app/src/main/res/layout
        mkdir -p app/src/main/res/drawable
        mkdir -p app/src/main/res/xml
        mkdir -p app/src/main/res/values

        cat << 'EOF' > gradle.properties
        android.useAndroidX=true
        android.enableJetifier=true
        org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
        org.gradle.caching=true
        org.gradle.parallel=true
        kotlin.incremental=true
        EOF

        cat << 'EOF' > settings.gradle.kts
        pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
        dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
        rootProject.name = "CCCDScannerV13"
        include(":app")
        EOF

        cat << 'EOF' > build.gradle.kts
        plugins {
            id("com.android.application") version "8.2.2" apply false
            id("org.jetbrains.kotlin.android") version "1.9.22" apply false
        }
        EOF

        cat << 'EOF' > app/build.gradle.kts
        plugins {
            id("com.android.application")
            id("org.jetbrains.kotlin.android")
        }
        val runNumber = System.getenv("GITHUB_RUN_NUMBER")?.toIntOrNull() ?: 1
        android {
            namespace = "com.example.cccdscanner"
            compileSdk = 34
            defaultConfig {
                applicationId = "com.example.cccdscanner"
                minSdk = 24
                targetSdk = 34
                versionCode = 100 + runNumber
                versionName = "13.0 Pro"
            }
            signingConfigs {
                create("debugConfig") {
                    storeFile = file(System.getProperty("user.home") + "/.android/debug.keystore")
                    storePassword = "android"
                    keyAlias = "androiddebugkey"
                    keyPassword = "android"
                }
            }
            buildTypes {
                getByName("debug") {
                    signingConfig = signingConfigs.getByName("debugConfig")
                    isDebuggable = false
                }
                getByName("release") { signingConfig = signingConfigs.getByName("debugConfig") }
            }
            compileOptions {
                sourceCompatibility = JavaVersion.VERSION_17
                targetCompatibility = JavaVersion.VERSION_17
            }
            kotlinOptions { jvmTarget = "17" }
            packaging { resources { excludes += "/META-INF/{AL2.0,LGPL2.1}" } }
        }
        dependencies {
            implementation("androidx.core:core-ktx:1.12.0")
            implementation("androidx.appcompat:appcompat:1.6.1")
            implementation("com.google.android.material:material:1.11.0")
            implementation("androidx.constraintlayout:constraintlayout:2.1.4")
            implementation("androidx.activity:activity-ktx:1.8.2")
            implementation("androidx.exifinterface:exifinterface:1.3.7")
            val camerax = "1.3.1"
            implementation("androidx.camera:camera-core:${camerax}")
            implementation("androidx.camera:camera-camera2:${camerax}")
            implementation("androidx.camera:camera-lifecycle:${camerax}")
            implementation("androidx.camera:camera-view:${camerax}")
            implementation("androidx.camera:camera-mlkit-vision:${camerax}")
            implementation("com.google.mlkit:barcode-scanning:17.3.0")
            implementation("com.google.android.gms:play-services-tasks:18.1.0")
        }
        EOF

        cat << 'EOF' > app/src/main/res/xml/file_paths.xml
        <?xml version="1.0" encoding="utf-8"?>
        <paths>
            <external-cache-path name="external_camera_images" path="/" />
            <cache-path name="internal_camera_images" path="/" />
            <external-files-path name="my_downloads" path="Download/" />
        </paths>
        EOF

        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.CAMERA" />
            <uses-permission android:name="android.permission.INTERNET" />
            <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />
            <uses-feature android:name="android.hardware.camera" android:required="false" />
            <uses-feature android:name="android.hardware.camera.autofocus" android:required="false" />

            <application
                android:allowBackup="true"
                android:icon="@drawable/ic_launcher"
                android:label="CCCD Scanner"
                android:theme="@style/AppTheme">

                <provider
                    android:name="androidx.core.content.FileProvider"
                    android:authorities="${applicationId}.fileprovider"
                    android:exported="false"
                    android:grantUriPermissions="true">
                    <meta-data
                        android:name="android.support.FILE_PROVIDER_PATHS"
                        android:resource="@xml/file_paths" />
                </provider>

                <activity
                    android:name=".MainActivity"
                    android:exported="true"
                    android:screenOrientation="portrait">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF

    # ------------------------------------------------------------------
    # 2) TÀI NGUYÊN GIAO DIỆN (theme, drawable, layout)
    # ------------------------------------------------------------------
    - name: Create UI Resources
      run: |
        cat << 'EOF' > app/src/main/res/values/themes.xml
        <?xml version="1.0" encoding="utf-8"?>
        <resources>
            <style name="AppTheme" parent="Theme.MaterialComponents.Light.NoActionBar">
                <item name="colorPrimary">#E9C46A</item>
                <item name="colorOnPrimary">#1A1405</item>
                <item name="colorSecondary">#00E5FF</item>
                <item name="android:statusBarColor">#000000</item>
                <item name="android:navigationBarColor">#000000</item>
                <item name="android:windowBackground">#000000</item>
            </style>

            <!-- Nhãn nhỏ phía trên mỗi trường thông tin -->
            <style name="Lbl">
                <item name="android:textSize">11sp</item>
                <item name="android:textColor">#8F9BC4</item>
                <item name="android:letterSpacing">0.14</item>
                <item name="android:fontFamily">sans-serif-medium</item>
            </style>

            <!-- Giá trị thông tin -->
            <style name="Val">
                <item name="android:textSize">17sp</item>
                <item name="android:textColor">#F5F7FF</item>
                <item name="android:fontFamily">sans-serif-medium</item>
                <item name="android:layout_marginTop">4dp</item>
            </style>
        </resources>
        EOF

        cat << 'EOF' > app/src/main/res/drawable/ic_launcher.xml
        <?xml version="1.0" encoding="utf-8"?>
        <vector xmlns:android="http://schemas.android.com/apk/res/android"
            android:width="108dp" android:height="108dp"
            android:viewportWidth="108" android:viewportHeight="108">
            <path android:fillColor="#0B1020"
                android:pathData="M24,0h60a24,24 0 0 1 24,24v60a24,24 0 0 1 -24,24h-60a24,24 0 0 1 -24,-24v-60a24,24 0 0 1 24,-24z" />
            <path android:strokeColor="#E9C46A" android:strokeWidth="4" android:strokeLineCap="round"
                android:pathData="M30,46 V36 Q30,30 36,30 H46 M62,30 H72 Q78,30 78,36 V46 M78,62 V72 Q78,78 72,78 H62 M46,78 H36 Q30,78 30,72 V62" />
            <path android:fillColor="#4DD0E1"
                android:pathData="M44,44h8v8h-8z M56,44h8v8h-8z M44,56h8v8h-8z M58,58h6v6h-6z" />
        </vector>
        EOF

        cat << 'EOF' > app/src/main/res/drawable/bg_result.xml
        <?xml version="1.0" encoding="utf-8"?>
        <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
            <gradient android:angle="270" android:startColor="#0B1020" android:endColor="#151E40" />
        </shape>
        EOF

        cat << 'EOF' > app/src/main/res/drawable/bg_card_id.xml
        <?xml version="1.0" encoding="utf-8"?>
        <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
            <gradient android:angle="315" android:startColor="#222E62" android:endColor="#131B3D" />
            <corners android:radius="26dp" />
            <stroke android:width="1dp" android:color="#3B488A" />
        </shape>
        EOF

        cat << 'EOF' > app/src/main/res/drawable/bg_card_soft.xml
        <?xml version="1.0" encoding="utf-8"?>
        <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
            <solid android:color="#111936" />
            <corners android:radius="22dp" />
            <stroke android:width="1dp" android:color="#252F5C" />
        </shape>
        EOF

        cat << 'EOF' > app/src/main/res/drawable/bg_chip_ok.xml
        <?xml version="1.0" encoding="utf-8"?>
        <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
            <solid android:color="#16382A" />
            <corners android:radius="50dp" />
            <stroke android:width="1dp" android:color="#2FBF71" />
        </shape>
        EOF

        cat << 'EOF' > app/src/main/res/drawable/bg_bottom_bar.xml
        <?xml version="1.0" encoding="utf-8"?>
        <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
            <solid android:color="#0E1531" />
            <stroke android:width="1dp" android:color="#1F2850" />
        </shape>
        EOF

        cat << 'EOF' > app/src/main/res/layout/activity_main.xml
        <?xml version="1.0" encoding="utf-8"?>
        <FrameLayout xmlns:android="http://schemas.android.com/apk/res/android"
            xmlns:app="http://schemas.android.com/apk/res-auto"
            android:layout_width="match_parent"
            android:layout_height="match_parent"
            android:background="#000000">

            <!-- Lớp 1: Camera -->
            <androidx.camera.view.PreviewView
                android:id="@+id/viewFinder"
                android:layout_width="match_parent"
                android:layout_height="match_parent" />

            <!-- Lớp 2: Hiệu ứng quét 3D / 4D -->
            <com.example.cccdscanner.ScanOverlayView
                android:id="@+id/scanOverlay"
                android:layout_width="match_parent"
                android:layout_height="match_parent" />

            <!-- Thanh trên: tiêu đề + đèn pin -->
            <LinearLayout
                android:layout_width="match_parent"
                android:layout_height="wrap_content"
                android:layout_gravity="top"
                android:gravity="center_vertical"
                android:orientation="horizontal"
                android:padding="16dp">

                <TextView
                    android:layout_width="0dp"
                    android:layout_height="wrap_content"
                    android:layout_weight="1"
                    android:text="Quét mã QR CCCD"
                    android:textColor="#FFFFFF"
                    android:textSize="18sp"
                    android:textStyle="bold" />

                <com.google.android.material.button.MaterialButton
                    android:id="@+id/btnTorch"
                    android:layout_width="48dp"
                    android:layout_height="48dp"
                    android:insetTop="0dp"
                    android:insetBottom="0dp"
                    android:minWidth="0dp"
                    android:minHeight="0dp"
                    android:padding="0dp"
                    android:text="🔦"
                    android:textSize="20sp"
                    app:backgroundTint="#55000000"
                    app:cornerRadius="24dp" />
            </LinearLayout>

            <!-- Thanh dưới: chọn ảnh / chụp ảnh -->
            <LinearLayout
                android:layout_width="match_parent"
                android:layout_height="wrap_content"
                android:layout_gravity="bottom"
                android:orientation="horizontal"
                android:padding="16dp">

                <com.google.android.material.button.MaterialButton
                    android:id="@+id/btnGallery"
                    android:layout_width="0dp"
                    android:layout_height="54dp"
                    android:layout_marginEnd="8dp"
                    android:layout_weight="1"
                    android:text="🖼  Chọn ảnh"
                    android:textAllCaps="false"
                    android:textColor="#FFFFFF"
                    android:textSize="15sp"
                    app:backgroundTint="#59FFFFFF"
                    app:cornerRadius="18dp" />

                <com.google.android.material.button.MaterialButton
                    android:id="@+id/btnCapture"
                    android:layout_width="0dp"
                    android:layout_height="54dp"
                    android:layout_marginStart="8dp"
                    android:layout_weight="1"
                    android:text="📷  Chụp ảnh"
                    android:textAllCaps="false"
                    android:textColor="#1A1405"
                    android:textSize="15sp"
                    app:backgroundTint="#E9C46A"
                    app:cornerRadius="18dp" />
            </LinearLayout>

            <!-- ================= MÀN HÌNH KẾT QUẢ ================= -->
            <LinearLayout
                android:id="@+id/resultRoot"
                android:layout_width="match_parent"
                android:layout_height="match_parent"
                android:background="@drawable/bg_result"
                android:clickable="true"
                android:focusable="true"
                android:orientation="vertical"
                android:visibility="gone">

                <!-- Tiêu đề -->
                <LinearLayout
                    android:id="@+id/resultHeader"
                    android:layout_width="match_parent"
                    android:layout_height="wrap_content"
                    android:gravity="center_vertical"
                    android:orientation="horizontal"
                    android:paddingStart="24dp"
                    android:paddingTop="20dp"
                    android:paddingEnd="24dp"
                    android:paddingBottom="12dp">

                    <LinearLayout
                        android:layout_width="0dp"
                        android:layout_height="wrap_content"
                        android:layout_weight="1"
                        android:orientation="vertical">

                        <TextView
                            style="@style/Lbl"
                            android:layout_width="wrap_content"
                            android:layout_height="wrap_content"
                            android:text="CĂN CƯỚC CÔNG DÂN"
                            android:textColor="#E9C46A" />

                        <TextView
                            android:layout_width="wrap_content"
                            android:layout_height="wrap_content"
                            android:layout_marginTop="2dp"
                            android:text="Thông tin đọc từ mã QR"
                            android:textColor="#FFFFFF"
                            android:textSize="21sp"
                            android:textStyle="bold" />
                    </LinearLayout>

                    <TextView
                        android:layout_width="wrap_content"
                        android:layout_height="wrap_content"
                        android:background="@drawable/bg_chip_ok"
                        android:paddingStart="12dp"
                        android:paddingTop="6dp"
                        android:paddingEnd="12dp"
                        android:paddingBottom="6dp"
                        android:text="✓ Thành công"
                        android:textColor="#6BF0A5"
                        android:textSize="12sp"
                        android:textStyle="bold" />
                </LinearLayout>

                <!-- Nội dung cuộn -->
                <ScrollView
                    android:id="@+id/resultScroll"
                    android:layout_width="match_parent"
                    android:layout_height="0dp"
                    android:layout_weight="1"
                    android:fillViewport="true"
                    android:scrollbars="none">

                    <LinearLayout
                        android:layout_width="match_parent"
                        android:layout_height="wrap_content"
                        android:orientation="vertical"
                        android:paddingStart="20dp"
                        android:paddingTop="8dp"
                        android:paddingEnd="20dp"
                        android:paddingBottom="20dp">

                        <!-- Thẻ chính -->
                        <LinearLayout
                            android:id="@+id/cardMain"
                            android:layout_width="match_parent"
                            android:layout_height="wrap_content"
                            android:background="@drawable/bg_card_id"
                            android:orientation="vertical"
                            android:padding="24dp">

                            <TextView
                                style="@style/Lbl"
                                android:layout_width="wrap_content"
                                android:layout_height="wrap_content"
                                android:text="SỐ CĂN CƯỚC" />

                            <LinearLayout
                                android:layout_width="match_parent"
                                android:layout_height="wrap_content"
                                android:layout_marginTop="4dp"
                                android:gravity="center_vertical"
                                android:orientation="horizontal">

                                <TextView
                                    android:id="@+id/tvCccd"
                                    android:layout_width="0dp"
                                    android:layout_height="wrap_content"
                                    android:layout_weight="1"
                                    android:letterSpacing="0.06"
                                    android:text="---"
                                    android:textColor="#FFFFFF"
                                    android:textSize="26sp"
                                    android:textStyle="bold" />

                                <com.google.android.material.button.MaterialButton
                                    android:id="@+id/btnCopyId"
                                    style="@style/Widget.MaterialComponents.Button.TextButton"
                                    android:layout_width="wrap_content"
                                    android:layout_height="40dp"
                                    android:text="Chép số"
                                    android:textAllCaps="false"
                                    android:textColor="#E9C46A"
                                    android:textSize="13sp" />
                            </LinearLayout>

                            <View
                                android:layout_width="match_parent"
                                android:layout_height="1dp"
                                android:layout_marginTop="16dp"
                                android:layout_marginBottom="16dp"
                                android:background="#2E3A70" />

                            <TextView
                                style="@style/Lbl"
                                android:layout_width="wrap_content"
                                android:layout_height="wrap_content"
                                android:text="HỌ VÀ TÊN" />

                            <TextView
                                android:id="@+id/tvName"
                                style="@style/Val"
                                android:layout_width="match_parent"
                                android:layout_height="wrap_content"
                                android:text="---"
                                android:textSize="21sp"
                                android:textStyle="bold" />

                            <View
                                android:layout_width="match_parent"
                                android:layout_height="1dp"
                                android:layout_marginTop="16dp"
                                android:layout_marginBottom="16dp"
                                android:background="#2E3A70" />

                            <LinearLayout
                                android:layout_width="match_parent"
                                android:layout_height="wrap_content"
                                android:orientation="horizontal">

                                <LinearLayout
                                    android:layout_width="0dp"
                                    android:layout_height="wrap_content"
                                    android:layout_weight="1"
                                    android:orientation="vertical">

                                    <TextView
                                        style="@style/Lbl"
                                        android:layout_width="wrap_content"
                                        android:layout_height="wrap_content"
                                        android:text="NGÀY SINH" />

                                    <TextView
                                        android:id="@+id/tvDob"
                                        style="@style/Val"
                                        android:layout_width="wrap_content"
                                        android:layout_height="wrap_content"
                                        android:text="---" />
                                </LinearLayout>

                                <LinearLayout
                                    android:layout_width="0dp"
                                    android:layout_height="wrap_content"
                                    android:layout_weight="1"
                                    android:orientation="vertical">

                                    <TextView
                                        style="@style/Lbl"
                                        android:layout_width="wrap_content"
                                        android:layout_height="wrap_content"
                                        android:text="GIỚI TÍNH" />

                                    <TextView
                                        android:id="@+id/tvGender"
                                        style="@style/Val"
                                        android:layout_width="wrap_content"
                                        android:layout_height="wrap_content"
                                        android:text="---" />
                                </LinearLayout>
                            </LinearLayout>

                            <View
                                android:layout_width="match_parent"
                                android:layout_height="1dp"
                                android:layout_marginTop="16dp"
                                android:layout_marginBottom="16dp"
                                android:background="#2E3A70" />

                            <LinearLayout
                                android:layout_width="match_parent"
                                android:layout_height="wrap_content"
                                android:orientation="horizontal">

                                <LinearLayout
                                    android:layout_width="0dp"
                                    android:layout_height="wrap_content"
                                    android:layout_weight="1"
                                    android:orientation="vertical">

                                    <TextView
                                        style="@style/Lbl"
                                        android:layout_width="wrap_content"
                                        android:layout_height="wrap_content"
                                        android:text="NGÀY CẤP" />

                                    <TextView
                                        android:id="@+id/tvIssue"
                                        style="@style/Val"
                                        android:layout_width="wrap_content"
                                        android:layout_height="wrap_content"
                                        android:text="---" />
                                </LinearLayout>

                                <LinearLayout
                                    android:layout_width="0dp"
                                    android:layout_height="wrap_content"
                                    android:layout_weight="1"
                                    android:orientation="vertical">

                                    <TextView
                                        style="@style/Lbl"
                                        android:layout_width="wrap_content"
                                        android:layout_height="wrap_content"
                                        android:text="SỐ CMND CŨ" />

                                    <TextView
                                        android:id="@+id/tvCmnd"
                                        style="@style/Val"
                                        android:layout_width="wrap_content"
                                        android:layout_height="wrap_content"
                                        android:text="---" />
                                </LinearLayout>
                            </LinearLayout>

                            <View
                                android:layout_width="match_parent"
                                android:layout_height="1dp"
                                android:layout_marginTop="16dp"
                                android:layout_marginBottom="16dp"
                                android:background="#2E3A70" />

                            <TextView
                                style="@style/Lbl"
                                android:layout_width="wrap_content"
                                android:layout_height="wrap_content"
                                android:text="NƠI THƯỜNG TRÚ" />

                            <TextView
                                android:id="@+id/tvAddress"
                                style="@style/Val"
                                android:layout_width="match_parent"
                                android:layout_height="wrap_content"
                                android:lineSpacingExtra="3dp"
                                android:text="---"
                                android:textSize="16sp" />
                        </LinearLayout>

                        <!-- Thẻ phụ: suy ra từ số CCCD -->
                        <LinearLayout
                            android:id="@+id/cardExtra"
                            android:layout_width="match_parent"
                            android:layout_height="wrap_content"
                            android:layout_marginTop="16dp"
                            android:background="@drawable/bg_card_soft"
                            android:orientation="vertical"
                            android:padding="20dp">

                            <TextView
                                style="@style/Lbl"
                                android:layout_width="wrap_content"
                                android:layout_height="wrap_content"
                                android:text="SUY RA TỪ SỐ CĂN CƯỚC"
                                android:textColor="#E9C46A" />

                            <LinearLayout
                                android:layout_width="match_parent"
                                android:layout_height="wrap_content"
                                android:layout_marginTop="14dp"
                                android:orientation="horizontal">

                                <LinearLayout
                                    android:layout_width="0dp"
                                    android:layout_height="wrap_content"
                                    android:layout_weight="1"
                                    android:orientation="vertical">

                                    <TextView
                                        style="@style/Lbl"
                                        android:layout_width="wrap_content"
                                        android:layout_height="wrap_content"
                                        android:text="TUỔI" />

                                    <TextView
                                        android:id="@+id/tvAge"
                                        style="@style/Val"
                                        android:layout_width="wrap_content"
                                        android:layout_height="wrap_content"
                                        android:text="---" />
                                </LinearLayout>

                                <LinearLayout
                                    android:layout_width="0dp"
                                    android:layout_height="wrap_content"
                                    android:layout_weight="1"
                                    android:orientation="vertical">

                                    <TextView
                                        style="@style/Lbl"
                                        android:layout_width="wrap_content"
                                        android:layout_height="wrap_content"
                                        android:text="NƠI ĐĂNG KÝ KHAI SINH" />

                                    <TextView
                                        android:id="@+id/tvBirthPlace"
                                        style="@style/Val"
                                        android:layout_width="wrap_content"
                                        android:layout_height="wrap_content"
                                        android:text="---" />
                                </LinearLayout>
                            </LinearLayout>
                        </LinearLayout>

                        <!-- Chân trang: bản quyền + cập nhật -->
                        <LinearLayout
                            android:id="@+id/footerBox"
                            android:layout_width="match_parent"
                            android:layout_height="wrap_content"
                            android:layout_marginTop="20dp"
                            android:gravity="center_horizontal"
                            android:orientation="vertical">

                            <TextView
                                android:layout_width="wrap_content"
                                android:layout_height="wrap_content"
                                android:text="🛡️ Bản quyền: trandoconghuy@gmail.com"
                                android:textColor="#E57373"
                                android:textSize="12sp"
                                android:textStyle="bold" />

                            <TextView
