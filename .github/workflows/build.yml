    - name: Create Kotlin Source - Parser
      run: |
        cat << 'EOF' > app/src/main/java/com/example/cccdscanner/CccdParser.kt
        package com.example.cccdscanner

        import java.util.Calendar

        data class CccdInfo(
            val cccd: String,
            val cmnd: String,
            val name: String,
            val dob: String,
            val gender: String,
            val address: String,
            val issueDate: String
        )

        object CccdParser {

            /** QR CCCD: số CCCD|số CMND cũ|Họ tên|ddMMyyyy|Giới tính|Địa chỉ|ddMMyyyy(ngày cấp) */
            fun parse(raw: String?): CccdInfo? {
                if (raw.isNullOrBlank() || !raw.contains("|")) return null
                val p = raw.split("|").map { it.trim() }
                if (p.size < 6) return null
                if (!Regex("\\d{9,12}").matches(p[0])) return null
                return CccdInfo(
                    cccd = p[0],
                    cmnd = p[1],
                    name = p[2],
                    dob = p[3],
                    gender = p[4],
                    address = p[5],
                    issueDate = if (p.size > 6) p[6] else ""
                )
            }

            fun formatDate(s: String): String {
                if (s.length == 8 && s.all { it.isDigit() }) {
                    return s.substring(0, 2) + "/" + s.substring(2, 4) + "/" + s.substring(4, 8)
                }
                return if (s.isBlank()) "—" else s
            }

            fun groupNumber(s: String): String = s.chunked(3).joinToString(" ")

            fun age(dob: String): Int? {
                if (dob.length != 8 || !dob.all { it.isDigit() }) return null
                val d = dob.substring(0, 2).toInt()
                val m = dob.substring(2, 4).toInt()
                val y = dob.substring(4, 8).toInt()
                val cal = Calendar.getInstance()
                var a = cal.get(Calendar.YEAR) - y
                val mm = cal.get(Calendar.MONTH) + 1
                if (mm < m || (mm == m && cal.get(Calendar.DAY_OF_MONTH) < d)) a--
                return if (a in 0..130) a else null
            }

            fun birthPlace(cccd: String): String {
                if (cccd.length != 12) return "—"
                return PROVINCES[cccd.substring(0, 3)] ?: "—"
            }

            private val PROVINCES = mapOf(
                "001" to "Hà Nội", "002" to "Hà Giang", "004" to "Cao Bằng", "006" to "Bắc Kạn",
                "008" to "Tuyên Quang", "010" to "Lào Cai", "011" to "Điện Biên", "012" to "Lai Châu",
                "014" to "Sơn La", "015" to "Yên Bái", "017" to "Hòa Bình", "019" to "Thái Nguyên",
                "020" to "Lạng Sơn", "022" to "Quảng Ninh", "024" to "Bắc Giang", "025" to "Phú Thọ",
                "026" to "Vĩnh Phúc", "027" to "Bắc Ninh", "030" to "Hải Dương", "031" to "Hải Phòng",
                "033" to "Hưng Yên", "034" to "Thái Bình", "035" to "Hà Nam", "036" to "Nam Định",
                "037" to "Ninh Bình", "038" to "Thanh Hóa", "040" to "Nghệ An", "042" to "Hà Tĩnh",
                "044" to "Quảng Bình", "045" to "Quảng Trị", "046" to "Thừa Thiên Huế", "048" to "Đà Nẵng",
                "049" to "Quảng Nam", "051" to "Quảng Ngãi", "052" to "Bình Định", "054" to "Phú Yên",
                "056" to "Khánh Hòa", "058" to "Ninh Thuận", "060" to "Bình Thuận", "062" to "Kon Tum",
                "064" to "Gia Lai", "066" to "Đắk Lắk", "067" to "Đắk Nông", "068" to "Lâm Đồng",
