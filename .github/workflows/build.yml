name: Build Android APK V10

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Khôi phục và Lưu trữ Chữ ký (Bảo vệ Cài đè)
      uses: actions/cache@v4
      with:
        path: ~/.android/debug.keystore
        key: android-debug-keystore-v1

    - name: Create Project Files
      run: |
        mkdir -p app/src/main/java/com/example/cccdscanner
        mkdir -p app/src/main/res/layout
        mkdir -p app/src/main/res/drawable
        mkdir -p app/src/main/res/xml

        cat << 'EOF' > gradle.properties
        android.useAndroidX=true
        android.enableJetifier=true
        org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
        EOF

        cat << 'EOF' > settings.gradle.kts
        pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
        dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
        rootProject.name = "CCCDScannerV10"
        include(":app")
        EOF

        cat << 'EOF' > build.gradle.kts
        plugins {
            id("com.android.application") version "8.2.2" apply false
            id("org.jetbrains.kotlin.android") version "1.9.22" apply false
        }
        EOF

        cat << 'EOF' > app/build.gradle.kts
        plugins {
            id("com.android.application")
            id("org.jetbrains.kotlin.android")
        }
        android {
            namespace = "com.example.cccdscanner"
            compileSdk = 34
            defaultConfig {
                applicationId = "com.example.cccdscanner"
                minSdk = 24
                targetSdk = 34
                versionCode = 10
                versionName = "10.0 Smart"
            }
            compileOptions {
                sourceCompatibility = JavaVersion.VERSION_17
                targetCompatibility = JavaVersion.VERSION_17
            }
            kotlinOptions { jvmTarget = "17" }
        }
        dependencies {
            implementation("androidx.core:core-ktx:1.12.0")
            implementation("androidx.appcompat:appcompat:1.6.1")
            implementation("com.google.android.material:material:1.11.0")
            implementation("androidx.constraintlayout:constraintlayout:2.1.4")
            val camerax_version = "1.3.1"
            implementation("androidx.camera:camera-core:${camerax_version}")
            implementation("androidx.camera:camera-camera2:${camerax_version}")
            implementation("androidx.camera:camera-lifecycle:${camerax_version}")
            implementation("androidx.camera:camera-view:${camerax_version}")
            implementation("com.google.mlkit:barcode-scanning:17.3.0")
            implementation("androidx.activity:activity-ktx:1.8.2")
        }
        EOF

        cat << 'EOF' > app/src/main/res/xml/file_paths.xml
        <?xml version="1.0" encoding="utf-8"?>
        <paths>
            <external-cache-path name="external_camera_images" path="/" />
            <cache-path name="internal_camera_images" path="/" />
            <external-files-path name="my_downloads" path="Download/" />
            <external-path name="external_files" path="." />
        </paths>
        EOF

        cat << 'EOF' > app/src/main/res/drawable/bg_cccd_card.xml
        <?xml version="1.0" encoding="utf-8"?>
        <shape xmlns:android="http://schemas.android.com/apk/res/android">
            <gradient android:startColor="#ffffff" android:endColor="#e8f5e9" android:angle="135"/>
            <corners android:radius="16dp"/>
            <stroke android:width="1dp" android:color="#c8e6c9"/>
        </shape>
        EOF

        cat << 'EOF' > app/src/main/res/drawable/bg_btn_update.xml
        <?xml version="1.0" encoding="utf-8"?>
        <shape xmlns:android="http://schemas.android.com/apk/res/android">
            <solid android:color="#D32F2F"/>
            <corners android:radius="20dp"/>
        </shape>
        EOF

        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.CAMERA" />
            <uses-permission android:name="android.permission.INTERNET" />
            <uses-feature android:name="android.hardware.camera" android:required="true" />
            <uses-feature android:name="android.hardware.camera.autofocus" />
            
            <application
                android:allowBackup="true"
                android:label="CCCD Pro Max"
                android:theme="@style/Theme.AppCompat.Light.NoActionBar">
                
                <provider
                    android:name="androidx.core.content.FileProvider"
                    android:authorities="${applicationId}.fileprovider"
                    android:exported="false"
                    android:grantUriPermissions="true">
                    <meta-data
                        android:name="android.support.FILE_PROVIDER_PATHS"
                        android:resource="@xml/file_paths" />
                </provider>

                <activity android:name=".MainActivity" android:exported="true" android:screenOrientation="portrait">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF

        cat << 'EOF' > app/src/main/res/layout/activity_main.xml
        <?xml version="1.0" encoding="utf-8"?>
        <FrameLayout xmlns:android="http://schemas.android.com/apk/res/android"
            android:layout_width="match_parent" android:layout_height="match_parent"
            android:background="#000000">

            <androidx.camera.view.PreviewView
                android:id="@+id/viewFinder"
                android:layout_width="match_parent"
                android:layout_height="match_parent" />

            <com.example.cccdscanner.ScannerOverlayView
                android:id="@+id/overlayView"
                android:layout_width="match_parent"
                android:layout_height="match_parent" />

            <!-- Nút Update Dời Xuống Góc Dưới Phải (Nho gọn, bo tròn) -->
            <Button
                android:id="@+id/btnUpdate"
                android:layout_width="wrap_content"
                android:layout_height="40dp"
                android:layout_gravity="bottom|end"
                android:layout_marginBottom="110dp"
                android:layout_marginEnd="16dp"
                android:paddingStart="15dp"
                android:paddingEnd="15dp"
                android:text="🔄 Cập Nhật"
                android:textSize="12sp"
                android:background="@drawable/bg_btn_update"
                android:textColor="#ffffff"
                android:elevation="10dp"/>

            <TextView
                android:layout_width="wrap_content"
                android:layout_height="wrap_content"
                android:text="QUÉT TOÀN MÀN HÌNH\nChạm để lấy nét - Tránh lóa sáng"
                android:textAlignment="center"
                android:textColor="#00E676"
                android:textStyle="bold"
                android:textSize="16sp"
                android:layout_gravity="center_horizontal"
                android:layout_marginTop="80dp"
                android:shadowColor="#000000"
                android:shadowRadius="10" />

            <LinearLayout
                android:layout_width="match_parent"
                android:layout_height="wrap_content"
                android:layout_gravity="bottom"
                android:orientation="horizontal"
                android:weightSum="2"
                android:padding="20dp"
                android:background="#80000000">
                <Button android:id="@+id/btnGallery" android:layout_width="0dp" android:layout_height="60dp" android:layout_weight="1" android:layout_marginEnd="10dp" android:text="🖼️ Chọn Ảnh" android:backgroundTint="#424242" android:textColor="#ffffff" android:textStyle="bold"/>
                <Button android:id="@+id/btnCapture" android:layout_width="0dp" android:layout_height="60dp" android:layout_weight="1" android:layout_marginStart="10dp" android:text="📸 Chụp Quét" android:backgroundTint="#0068ff" android:textColor="#ffffff" android:textStyle="bold"/>
            </LinearLayout>

            <!-- Khung Kết Quả Đã Cân Đối Lại Giao Diện & Bản Quyền -->
            <ScrollView android:id="@+id/resultLayout" android:layout_width="match_parent" android:layout_height="match_parent" android:background="#f4f5f7" android:visibility="gone">
                <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="vertical" android:padding="20dp">
                    <TextView android:layout_width="match_parent" android:layout_height="wrap_content" android:text="Thông Tin Căn Cước" android:textSize="22sp" android:textStyle="bold" android:textColor="#0068ff" android:gravity="center" android:layout_marginBottom="20dp"/>
                    
                    <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="vertical" android:background="@drawable/bg_cccd_card" android:padding="20dp" android:elevation="8dp">
                        
                        <!-- Bản quyền Nổi bật góc phải -->
                        <RelativeLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:layout_marginBottom="15dp">
                            <LinearLayout android:layout_width="wrap_content" android:layout_height="wrap_content" android:orientation="vertical">
                                <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="Số CCCD" android:textSize="12sp" android:textColor="#757575"/>
                                <TextView android:id="@+id/tvCccd" android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="0790..." android:textSize="24sp" android:textStyle="bold" android:textColor="#000000"/>
                            </LinearLayout>
                            
                            <LinearLayout android:layout_width="wrap_content" android:layout_height="wrap_content" android:layout_alignParentEnd="true" android:orientation="vertical" android:gravity="end">
                                <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="🛡️ Bản quyền:" android:textSize="11sp" android:textColor="#757575" android:textStyle="bold"/>
                                <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="trandoconghuy@gmail.com" android:textSize="13sp" android:textColor="#D50000" android:textStyle="bold"/>
                            </LinearLayout>
                        </RelativeLayout>
                        
                        <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="Họ và tên:" android:textSize="12sp" android:textColor="#757575"/>
                        <TextView android:id="@+id/tvName" android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="---" android:textSize="20sp" android:textStyle="bold" android:textColor="#000000" android:layout_marginBottom="15dp"/>
                        
                        <!-- Lưới Thông tin cân đối -->
                        <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="horizontal" android:layout_marginBottom="15dp" android:weightSum="2">
                            <LinearLayout android:layout_width="0dp" android:layout_height="wrap_content" android:layout_weight="1" android:orientation="vertical">
                                <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="Giới tính:" android:textSize="12sp" android:textColor="#757575"/>
                                <TextView android:id="@+id/tvGender" android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="---" android:textSize="16sp" android:textColor="#333333"/>
                            </LinearLayout>
                            <LinearLayout android:layout_width="0dp" android:layout_height="wrap_content" android:layout_weight="1" android:orientation="vertical">
                                <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="Ngày sinh:" android:textSize="12sp" android:textColor="#757575"/>
                                <TextView android:id="@+id/tvDob" android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="---" android:textSize="16sp" android:textColor="#333333"/>
                            </LinearLayout>
                        </LinearLayout>

                        <!-- Lưới Ngày cấp và CMND cũ -->
                        <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="horizontal" android:layout_marginBottom="15dp" android:weightSum="2">
                            <LinearLayout android:layout_width="0dp" android:layout_height="wrap_content" android:layout_weight="1" android:orientation="vertical">
                                <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="Ngày cấp:" android:textSize="12sp" android:textColor="#757575"/>
                                <TextView android:id="@+id/tvIssueDate" android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="---" android:textSize="16sp" android:textColor="#333333"/>
                            </LinearLayout>
                            <LinearLayout android:layout_width="0dp" android:layout_height="wrap_content" android:layout_weight="1" android:orientation="vertical">
                                <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="CMND cũ:" android:textSize="12sp" android:textColor="#757575"/>
                                <TextView android:id="@+id/tvCmnd" android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="---" android:textSize="16sp" android:textColor="#333333"/>
                            </LinearLayout>
                        </LinearLayout>

                        <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="Nơi thường trú:" android:textSize="12sp" android:textColor="#757575"/>
                        <TextView android:id="@+id/tvAddress" android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="---" android:textSize="16sp" android:textColor="#333333"/>
                    </LinearLayout>
                    <Button android:id="@+id/btnScanAgain" android:layout_width="match_parent" android:layout_height="54dp" android:layout_marginTop="30dp" android:text="🔄 Quét mã khác" android:backgroundTint="#0068ff" android:textColor="#ffffff" android:textStyle="bold"/>
                </LinearLayout>
            </ScrollView>
        </FrameLayout>
        EOF

        cat << 'EOF' > app/src/main/java/com/example/cccdscanner/MainActivity.kt
        package com.example.cccdscanner
        import android.Manifest
        import android.annotation.SuppressLint
        import android.app.DownloadManager
        import android.content.BroadcastReceiver
        import android.content.Context
        import android.content.Intent
        import android.content.IntentFilter
        import android.content.pm.PackageManager
        import android.graphics.*
        import android.media.AudioManager
        import android.media.ToneGenerator
        import android.net.Uri
        import android.os.Bundle
        import android.os.Environment
        import android.util.AttributeSet
        import android.view.MotionEvent
        import android.view.View
        import android.widget.Button
        import android.widget.ScrollView
        import android.widget.TextView
        import android.widget.Toast
        import androidx.activity.result.contract.ActivityResultContracts
        import androidx.appcompat.app.AppCompatActivity
        import androidx.camera.core.*
        import androidx.camera.core.resolutionselector.AspectRatioStrategy
        import androidx.camera.core.resolutionselector.ResolutionSelector
        import androidx.camera.lifecycle.ProcessCameraProvider
        import androidx.camera.view.PreviewView
        import androidx.core.content.ContextCompat
        import androidx.core.content.FileProvider
        import com.google.mlkit.vision.barcode.BarcodeScannerOptions
        import com.google.mlkit.vision.barcode.BarcodeScanning
        import com.google.mlkit.vision.barcode.common.Barcode
        import com.google.mlkit.vision.common.InputImage
        import java.io.File
        import java.util.concurrent.ExecutorService
        import java.util.concurrent.Executors
        import java.util.concurrent.TimeUnit

        class ScannerOverlayView(context: Context, attrs: AttributeSet?) : View(context, attrs) {
            private val strokePaint = Paint().apply { color = Color.parseColor("#00E676"); style = Paint.Style.STROKE; strokeWidth = 14f; strokeCap = Paint.Cap.ROUND }
            override fun onDraw(canvas: Canvas) {
                super.onDraw(canvas)
                val w = width.toFloat(); val h = height.toFloat()
                val pad = 60f; val c = 120f
                canvas.drawLine(pad, pad, pad + c, pad, strokePaint); canvas.drawLine(pad, pad, pad, pad + c, strokePaint)
                canvas.drawLine(w - pad, pad, w - pad - c, pad, strokePaint); canvas.drawLine(w - pad, pad, w - pad, pad + c, strokePaint)
                canvas.drawLine(pad, h - pad, pad + c, h - pad, strokePaint); canvas.drawLine(pad, h - pad, pad, h - pad - c, strokePaint)
                canvas.drawLine(w - pad, h - pad, w - pad - c, h - pad, strokePaint); canvas.drawLine(w - pad, h - pad, w - pad, h - pad - c, strokePaint)
            }
        }

        class MainActivity : AppCompatActivity() {
            private lateinit var viewFinder: PreviewView
            private lateinit var resultLayout: ScrollView
            private lateinit var cameraExecutor: ExecutorService
            private var cameraProvider: ProcessCameraProvider? = null
            private var camera: Camera? = null
            private var isScanning = true
            private var currentPhotoUri: Uri? = null

            private val scanner = BarcodeScanning.getClient(BarcodeScannerOptions.Builder().setBarcodeFormats(Barcode.FORMAT_QR_CODE).build())

            private val pickImageLauncher = registerForActivityResult(ActivityResultContracts.GetContent()) { uri: Uri? ->
                if (uri != null) processImageFromUri(uri) else { isScanning = true; startCamera() }
            }

            private val takePictureLauncher = registerForActivityResult(ActivityResultContracts.TakePicture()) { success ->
                if (success && currentPhotoUri != null) {
                    processImageFromUri(currentPhotoUri!!)
                } else {
                    Toast.makeText(this, "Đã hủy chụp ảnh", Toast.LENGTH_SHORT).show()
                    isScanning = true; startCamera()
                }
            }

            private val reqPerm = registerForActivityResult(ActivityResultContracts.RequestPermission()) { if (it) startCamera() }

            @SuppressLint("ClickableViewAccessibility")
            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                setContentView(R.layout.activity_main)
                viewFinder = findViewById(R.id.viewFinder)
                resultLayout = findViewById(R.id.resultLayout)
                cameraExecutor = Executors.newSingleThreadExecutor()

                // THÊM CHỨC NĂNG CHẠM ĐỂ LẤY NÉT (TOUCH TO FOCUS)
                viewFinder.setOnTouchListener { _, event ->
                    if (event.action == MotionEvent.ACTION_DOWN) {
                        val factory = viewFinder.meteringPointFactory
                        val point = factory.createPoint(event.x, event.y)
                        val action = FocusMeteringAction.Builder(point, FocusMeteringAction.FLAG_AF)
                            .setAutoCancelDuration(3, TimeUnit.SECONDS).build()
                        camera?.cameraControl?.startFocusAndMetering(action)
                    }
                    true
                }

                findViewById<Button>(R.id.btnGallery).setOnClickListener {
                    isScanning = false; cameraProvider?.unbindAll() 
                    pickImageLauncher.launch("image/*")
                }

                findViewById<Button>(R.id.btnCapture).setOnClickListener {
                    try {
                        isScanning = false; cameraProvider?.unbindAll() 
                        val safeCacheDir = externalCacheDir ?: cacheDir
                        val photoFile = File(safeCacheDir, "scan_${System.currentTimeMillis()}.jpg")
                        currentPhotoUri = FileProvider.getUriForFile(this, "${packageName}.fileprovider", photoFile)
                        takePictureLauncher.launch(currentPhotoUri)
                    } catch (e: Exception) {
                        Toast.makeText(this, "Lỗi file", Toast.LENGTH_SHORT).show()
                        isScanning = true; startCamera()
                    }
                }

                findViewById<Button>(R.id.btnScanAgain).setOnClickListener {
                    resultLayout.visibility = View.GONE
                    isScanning = true; startCamera()
                }

                findViewById<Button>(R.id.btnUpdate).setOnClickListener {
                    // QUAN TRỌNG: Hãy tải file APK của bạn lên một host trực tiếp (VD: Firebase, Github Release .apk) và thay link vào đây.
                    val directApkUrl = "https://example.com/app-release.apk" 
                    downloadAndInstall(directApkUrl)
                }

                if (ContextCompat.checkSelfPermission(this, Manifest.permission.CAMERA) == PackageManager.PERMISSION_GRANTED) startCamera()
                else reqPerm.launch(Manifest.permission.CAMERA)
            }

            private fun downloadAndInstall(url: String) {
                if(url.contains("example.com")) {
                    Toast.makeText(this, "Vui lòng nhập Link APK tĩnh (Direct Link) vào mã nguồn để tải ngầm!", Toast.LENGTH_LONG).show()
                    return
                }
                Toast.makeText(this, "Đang tải bản cập nhật ngầm...", Toast.LENGTH_LONG).show()
                val downloadDir = getExternalFilesDir(Environment.DIRECTORY_DOWNLOADS) ?: filesDir
                val oldFile = File(downloadDir, "update.apk")
                if(oldFile.exists()) oldFile.delete()

                val request = DownloadManager.Request(Uri.parse(url))
                    .setTitle("Cập Nhật CCCD Pro")
                    .setDestinationInExternalFilesDir(this, Environment.DIRECTORY_DOWNLOADS, "update.apk")
                    .setNotificationVisibility(DownloadManager.Request.VISIBILITY_VISIBLE_NOTIFY_COMPLETED)
                val manager = getSystemService(Context.DOWNLOAD_SERVICE) as DownloadManager
                val downloadId = manager.enqueue(request)

                val onComplete = object : BroadcastReceiver() {
                    override fun onReceive(context: Context, intent: Intent) {
                        val id = intent.getLongExtra(DownloadManager.EXTRA_DOWNLOAD_ID, -1)
                        if (id == downloadId) {
                            val targetDir = context.getExternalFilesDir(Environment.DIRECTORY_DOWNLOADS) ?: context.filesDir
                            val file = File(targetDir, "update.apk")
                            if (file.exists()) {
                                val uri = FileProvider.getUriForFile(context, "${context.packageName}.fileprovider", file)
                                val installIntent = Intent(Intent.ACTION_VIEW).apply {
                                    setDataAndType(uri, "application/vnd.android.package-archive")
                                    flags = Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_GRANT_READ_URI_PERMISSION
                                }
                                context.startActivity(installIntent)
                            }
                        }
                    }
                }
                ContextCompat.registerReceiver(this, onComplete, IntentFilter(DownloadManager.ACTION_DOWNLOAD_COMPLETE), ContextCompat.RECEIVER_EXPORTED)
            }

            private fun startCamera() {
                val providerFuture = ProcessCameraProvider.getInstance(this)
                providerFuture.addListener({
                    cameraProvider = providerFuture.get()
                    val preview = Preview.Builder().build().also { it.setSurfaceProvider(viewFinder.surfaceProvider) }
                    
                    val resolutionSelector = ResolutionSelector.Builder().setAspectRatioStrategy(AspectRatioStrategy.RATIO_16_9_FALLBACK_AUTO_STRATEGY).build()
                    val analyzer = ImageAnalysis.Builder().setBackpressureStrategy(ImageAnalysis.STRATEGY_KEEP_ONLY_LATEST).setResolutionSelector(resolutionSelector).build()
                        
                    analyzer.setAnalyzer(cameraExecutor) { proxy ->
                        val mediaImage = proxy.image
                        if (mediaImage != null && isScanning) {
                            val image = InputImage.fromMediaImage(mediaImage, proxy.imageInfo.rotationDegrees)
                            scanner.process(image).addOnSuccessListener { bars ->
                                for (b in bars) {
                                    if (!b.rawValue.isNullOrEmpty() && b.rawValue!!.contains("|")) {
                                        isScanning = false
                                        runOnUiThread { handleSuccess(b.rawValue!!) }
                                        break
                                    }
                                }
                            }.addOnCompleteListener { proxy.close() }
                        } else proxy.close()
                    }
                    try { 
                        cameraProvider?.unbindAll()
                        camera = cameraProvider?.bindToLifecycle(this, CameraSelector.DEFAULT_BACK_CAMERA, preview, analyzer) 
                    } catch (e: Exception) {}
                }, ContextCompat.getMainExecutor(this))
            }

            private fun processImageFromUri(uri: Uri) {
                cameraExecutor.execute {
                    try {
                        val image = InputImage.fromFilePath(this@MainActivity, uri)
                        scanner.process(image)
                            .addOnSuccessListener { barcodes ->
                                if (barcodes.isEmpty()) {
                                    runOnUiThread { Toast.makeText(this@MainActivity, "Không tìm thấy mã", Toast.LENGTH_SHORT).show(); isScanning = true; startCamera() }
                                } else {
                                    for (barcode in barcodes) {
                                        if (!barcode.rawValue.isNullOrEmpty() && barcode.rawValue!!.contains("|")) {
                                            runOnUiThread { handleSuccess(barcode.rawValue!!) }
                                            return@addOnSuccessListener
                                        }
                                    }
                                    runOnUiThread { Toast.makeText(this@MainActivity, "QR sai chuẩn", Toast.LENGTH_SHORT).show(); isScanning = true; startCamera() }
                                }
                            }.addOnFailureListener {
                                runOnUiThread { Toast.makeText(this@MainActivity, "Lỗi phân tích AI", Toast.LENGTH_SHORT).show(); isScanning = true; startCamera() }
                            }
                    } catch (e: Exception) {
                        runOnUiThread { Toast.makeText(this@MainActivity, "Lỗi đọc file", Toast.LENGTH_SHORT).show(); isScanning = true; startCamera() }
                    }
                }
            }

            // HÀM FORMAT NGÀY THÁNG
            private fun formatDate(dateStr: String): String {
                return if (dateStr.length == 8) "${dateStr.substring(0,2)}/${dateStr.substring(2,4)}/${dateStr.substring(4,8)}" else dateStr
            }

            private fun handleSuccess(text: String) {
                try { ToneGenerator(AudioManager.STREAM_ALARM, 100).startTone(ToneGenerator.TONE_PROP_BEEP, 150) } catch(e:Exception){}
                cameraProvider?.unbindAll()
                val parts = text.split("|")
                if (parts.size >= 7) { // Bổ sung đọc trường thứ 7 (Ngày cấp)
                    findViewById<TextView>(R.id.tvCccd).text = parts[0]
                    findViewById<TextView>(R.id.tvCmnd).text = parts[1].ifEmpty { "Không có" }
                    findViewById<TextView>(R.id.tvName).text = parts[2]
                    findViewById<TextView>(R.id.tvDob).text = formatDate(parts[3])
                    findViewById<TextView>(R.id.tvGender).text = parts[4]
                    findViewById<TextView>(R.id.tvAddress).text = parts[5]
                    findViewById<TextView>(R.id.tvIssueDate).text = formatDate(parts[6]) // Ngày cấp
                } else if(parts.size >= 6) {
                    findViewById<TextView>(R.id.tvCccd).text = parts[0]
                    findViewById<TextView>(R.id.tvCmnd).text = parts[1].ifEmpty { "Không có" }
                    findViewById<TextView>(R.id.tvName).text = parts[2]
                    findViewById<TextView>(R.id.tvDob).text = formatDate(parts[3])
                    findViewById<TextView>(R.id.tvGender).text = parts[4]
                    findViewById<TextView>(R.id.tvAddress).text = parts[5]
                    findViewById<TextView>(R.id.tvIssueDate).text = "Không xác định"
                }
                resultLayout.visibility = View.VISIBLE
            }
        }
        EOF

    - name: Build APK File
      run: |
        gradle wrapper --gradle-version 8.4
        chmod +x gradlew
        ./gradlew assembleDebug --stacktrace

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
