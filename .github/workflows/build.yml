    - name: Create Kotlin Source - MainActivity
      run: |
        cat << 'EOF' > app/src/main/java/com/example/cccdscanner/MainActivity.kt
        package com.example.cccdscanner

        import android.Manifest
        import android.app.DownloadManager
        import android.content.BroadcastReceiver
        import android.content.ClipData
        import android.content.ClipboardManager
        import android.content.Context
        import android.content.Intent
        import android.content.IntentFilter
        import android.content.pm.PackageManager
        import android.graphics.Bitmap
        import android.graphics.BitmapFactory
        import android.graphics.Canvas
        import android.graphics.ColorMatrix
        import android.graphics.ColorMatrixColorFilter
        import android.graphics.Matrix
        import android.graphics.Paint
        import android.graphics.Rect
        import android.media.AudioManager
        import android.media.ToneGenerator
        import android.net.Uri
        import android.os.Build
        import android.os.Bundle
        import android.os.Environment
        import android.os.Handler
        import android.os.Looper
        import android.provider.Settings
        import android.util.Size
        import android.view.HapticFeedbackConstants
        import android.view.View
        import android.view.animation.DecelerateInterpolator
        import android.widget.ScrollView
        import android.widget.TextView
        import android.widget.Toast
        import androidx.activity.OnBackPressedCallback
        import androidx.activity.result.contract.ActivityResultContracts
        import androidx.appcompat.app.AppCompatActivity
        import androidx.camera.core.CameraSelector
        import androidx.camera.core.ImageAnalysis
        import androidx.camera.core.resolutionselector.ResolutionSelector
        import androidx.camera.core.resolutionselector.ResolutionStrategy
        import androidx.camera.mlkit.vision.MlKitAnalyzer
        import androidx.camera.view.CameraController
        import androidx.camera.view.LifecycleCameraController
        import androidx.camera.view.PreviewView
        import androidx.core.content.ContextCompat
        import androidx.core.content.FileProvider
        import androidx.exifinterface.media.ExifInterface
        import com.google.android.gms.tasks.Tasks
        import com.google.android.material.button.MaterialButton
        import com.google.mlkit.vision.barcode.BarcodeScanner
        import com.google.mlkit.vision.barcode.BarcodeScannerOptions
        import com.google.mlkit.vision.barcode.BarcodeScanning
        import com.google.mlkit.vision.barcode.common.Barcode
        import com.google.mlkit.vision.common.InputImage
        import java.io.File
        import java.util.concurrent.ExecutorService
        import java.util.concurrent.Executors
        import java.util.concurrent.TimeUnit
        import kotlin.math.max

        class MainActivity : AppCompatActivity() {

            companion object {
                // Đổi thành link APK thực tế của bạn (GitHub Releases / Drive direct link...)
                private const val UPDATE_URL =
                    "https://github.com/trandoconghuy/thutuchanhchinh/releases/latest/download/app-debug.apk"
            }

            private lateinit var viewFinder: PreviewView
            private lateinit var overlay: ScanOverlayView
            private lateinit var resultRoot: View
            private lateinit var resultScroll: ScrollView
            private lateinit var controller: LifecycleCameraController
            private lateinit var scanner: BarcodeScanner
            private lateinit var btnTorch: MaterialButton

            private val analysisExecutor: ExecutorService = Executors.newSingleThreadExecutor()
            private val ioExecutor: ExecutorService = Executors.newSingleThreadExecutor()
            private val ui = Handler(Looper.getMainLooper())

            private var scanning = false
            private var torchOn = false
            private var cameraStarted = false
            private var currentPhotoFile: File? = null
            private var lastInfo: CccdInfo? = null
            private var downloadReceiver: BroadcastReceiver? = null

            private val backCallback = object : OnBackPressedCallback(false) {
                override fun handleOnBackPressed() { backToScan() }
            }

            // ---------- Launchers ----------
            private val pickImageLauncher =
                registerForActivityResult(ActivityResultContracts.GetContent()) { uri: Uri? ->
                    if (uri != null) processImage(uri, null) else resumeScanning()
                }

            private val takePictureLauncher =
                registerForActivityResult(ActivityResultContracts.TakePicture()) { ok: Boolean ->
                    val f = currentPhotoFile
                    if (ok && f != null && f.exists()) {
                        val uri = FileProvider.getUriForFile(this, "$packageName.fileprovider", f)
                        processImage(uri, f)
                    } else {
                        toast("Đã hủy chụp")
                        resumeScanning()
                    }
                }

            private val permissionLauncher =
                registerForActivityResult(ActivityResultContracts.RequestPermission()) { granted: Boolean ->
                    if (granted) startCamera() else toast("Cần quyền camera để quét trực tiếp. Bạn vẫn có thể chọn ảnh.")
                }

            // ---------- Vòng đời ----------
            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                setContentView(R.layout.activity_main)

                viewFinder = findViewById(R.id.viewFinder)
                overlay = findViewById(R.id.scanOverlay)
                resultRoot = findViewById(R.id.resultRoot)
                resultScroll = findViewById(R.id.resultScroll)
                btnTorch = findViewById(R.id.btnTorch)

                scanner = BarcodeScanning.getClient(
                    BarcodeScannerOptions.Builder().setBarcodeFormats(Barcode.FORMAT_QR_CODE).build()
                )

                setupController()
                onBackPressedDispatcher.addCallback(this, backCallback)

                btnTorch.setOnClickListener { toggleTorch() }

                findViewById<View>(R.id.btnGallery).setOnClickListener {
                    pauseScanning()
                    pickImageLauncher.launch("image/*")
                }

                findViewById<View>(R.id.btnCapture).setOnClickListener {
                    try {
                        pauseScanning()
                        val dir = externalCacheDir ?: cacheDir
                        val f = File(dir, "scan_" + System.currentTimeMillis() + ".jpg")
                        currentPhotoFile = f
                        val uri = FileProvider.getUriForFile(this, "$packageName.fileprovider", f)
                        takePictureLauncher.launch(uri)
                    } catch (e: Exception) {
                        toast("Không tạo được file ảnh")
                        resumeScanning()
                    }
                }

                findViewById<View>(R.id.btnScanAgain).setOnClickListener { backToScan() }
                findViewById<View>(R.id.btnCopyId).setOnClickListener {
                    lastInfo?.let { copyText(it.cccd, "Đã chép số CCCD") }
                }
                findViewById<View>(R.id.btnCopyAll).setOnClickListener {
                    lastInfo?.let { copyText(buildText(it), "Đã sao chép toàn bộ thông tin") }
                }
                findViewById<View>(R.id.btnShare).setOnClickListener {
                    lastInfo?.let { shareText(buildText(it)) }
                }
                findViewById<View>(R.id.btnUpdate).setOnClickListener { startUpdate() }

                val ver = try { packageManager.getPackageInfo(packageName, 0).versionName } catch (e: Exception) { "" }
                findViewById<TextView>(R.id.tvVersion).text = "Phiên bản $ver"

                if (ContextCompat.checkSelfPermission(this, Manifest.permission.CAMERA) == PackageManager.PERMISSION_GRANTED) {
                    startCamera()
                } else {
                    permissionLauncher.launch(Manifest.permission.CAMERA)
                }
            }

            override fun onResume() {
                super.onResume()
                if (scanning) overlay.setActive(true)
            }

            override fun onPause() {
                overlay.setActive(false)
                super.onPause()
            }

            override fun onDestroy() {
                ui.removeCallbacksAndMessages(null)
                downloadReceiver?.let { try { unregisterReceiver(it) } catch (e: Exception) {} }
                analysisExecutor.shutdown()
                ioExecutor.shutdown()
                scanner.close()
                super.onDestroy()
            }

            // ---------- Camera + quét nhanh ----------
            private fun setupController() {
                controller = LifecycleCameraController(this).apply {
                    setEnabledUseCases(CameraController.IMAGE_ANALYSIS)
                    cameraSelector = CameraSelector.DEFAULT_BACK_CAMERA
                    // 720p: đủ nét cho QR dày đặc của CCCD nhưng vẫn xử lý rất nhanh
                    imageAnalysisResolutionSelector = ResolutionSelector.Builder()
                        .setResolutionStrategy(
                            ResolutionStrategy(Size(1280, 720), ResolutionStrategy.FALLBACK_RULE_CLOSEST_HIGHER_THEN_LOWER)
                        ).build()
                    imageAnalysisBackpressureStrategy = ImageAnalysis.STRATEGY_KEEP_ONLY_LATEST
                }
                viewFinder.scaleType = PreviewView.ScaleType.FILL_CENTER
                viewFinder.controller = controller
            }

            private fun startCamera() {
                if (cameraStarted) return
                cameraStarted = true
                controller.bindToLifecycle(this)
                startScanning()
            }

            private fun startScanning() {
                if (!cameraStarted) return
                scanning = true
                overlay.reset()
                overlay.setActive(true)
                controller.setImageAnalysisAnalyzer(
                    analysisExecutor,
                    MlKitAnalyzer(
                        listOf(scanner),
                        ImageAnalysis.COORDINATE_SYSTEM_VIEW_REFERENCED,
                        ContextCompat.getMainExecutor(this)
                    ) { result -> handleResult(result) }
                )
            }

            private fun pauseScanning() {
                scanning = false
                if (cameraStarted) controller.clearImageAnalysisAnalyzer()
            }

            private fun resumeScanning() {
                if (resultRoot.visibility == View.VISIBLE) return
                startScanning()
            }

            private fun handleResult(result: MlKitAnalyzer.Result?) {
                if (!scanning) return
                val list = result?.getValue(scanner) ?: return
                for (b in list) {
                    val info = CccdParser.parse(b.rawValue)
                    val pts = cornerFloats(b)
                    if (info != null) {
                        onLocked(info, pts)
                        return
                    } else if (pts != null) {
                        overlay.track(pts)
                    }
                }
            }

            private fun cornerFloats(b: Barcode): FloatArray? {
                val c = b.cornerPoints
                if (c != null && c.size == 4) {
                    return floatArrayOf(
                        c[0].x.toFloat(), c[0].y.toFloat(), c[1].x.toFloat(), c[1].y.toFloat(),
                        c[2].x.toFloat(), c[2].y.toFloat(), c[3].x.toFloat(), c[3].y.toFloat()
                    )
                }
                val r = b.boundingBox ?: return null
                return floatArrayOf(
                    r.left.toFloat(), r.top.toFloat(), r.right.toFloat(), r.top.toFloat(),
                    r.right.toFloat(), r.bottom.toFloat(), r.left.toFloat(), r.bottom.toFloat()
                )
            }

            private fun onLocked(info: CccdInfo, pts: FloatArray?) {
                pauseScanning()
                lastInfo = info
                feedback()
                if (pts != null) overlay.lockOn(pts)
                ui.postDelayed({ showResult(info) }, if (pts != null) 480L else 0L)
            }

            private fun feedback() {
                try {
                    val tg = ToneGenerator(AudioManager.STREAM_MUSIC, 70)
                    tg.startTone(ToneGenerator.TONE_PROP_BEEP, 120)
                    ui.postDelayed({ tg.release() }, 400)
                } catch (e: Exception) {}
                val flag = if (Build.VERSION.SDK_INT >= 30) HapticFeedbackConstants.CONFIRM else HapticFeedbackConstants.LONG_PRESS
                overlay.performHapticFeedback(flag)
            }

            private fun toggleTorch() {
                if (!cameraStarted || controller.cameraInfo?.hasFlashUnit() != true) {
                    toast("Thiết bị không có đèn pin")
                    return
                }
                torchOn = !torchOn
                controller.enableTorch(torchOn)
                btnTorch.text = if (torchOn) "💡" else "🔦"
            }

            // ---------- Đọc QR từ ảnh (thư viện / chụp) ----------
            private fun processImage(uri: Uri, tempFile: File?) {
                toast("Đang phân tích ảnh...")
                ioExecutor.execute {
                    val info = try { decodeFromUri(uri) } catch (e: Exception) { null }
                    try { tempFile?.delete() } catch (e: Exception) {}
                    runOnUiThread {
                        if (isFinishing || isDestroyed) return@runOnUiThread
                        if (info != null) {
                            lastInfo = info
                            feedback()
                            showResult(info)
                        } else {
                            toast("Không tìm thấy mã QR CCCD trong ảnh. Hãy thử ảnh nét hơn.")
                            resumeScanning()
                        }
                    }
                }
            }

            private fun decodeFromUri(uri: Uri): CccdInfo? {
                val base = loadBitmap(uri) ?: return null
                val variants = sequence {
                    yield(base)
                    yield(enhance(base, 1.7f, 1f))
                    yield(enhance(base, 2.2f, 0.7f))
                }
                for (bmp in variants) {
                    val codes = Tasks.await(scanner.process(InputImage.fromBitmap(bmp, 0)), 10, TimeUnit.SECONDS)
                    for (b in codes) {
                        val info = CccdParser.parse(b.rawValue)
                        if (info != null) return info
                    }
                }
                return null
            }

            private fun loadBitmap(uri: Uri): Bitmap? {
                val maxDim = 2000
                val bounds = BitmapFactory.Options().apply { inJustDecodeBounds = true }
                contentResolver.openInputStream(uri)?.use { BitmapFactory.decodeStream(it, null, bounds) }
                var sample = 1
                while (max(bounds.outWidth, bounds.outHeight) / sample > maxDim) sample *= 2
                val opts = BitmapFactory.Options().apply { inSampleSize = sample }
                val bmp = contentResolver.openInputStream(uri)?.use { BitmapFactory.decodeStream(it, null, opts) } ?: return null
                val orient = contentResolver.openInputStream(uri)?.use {
                    ExifInterface(it).getAttributeInt(ExifInterface.TAG_ORIENTATION, ExifInterface.ORIENTATION_NORMAL)
                } ?: ExifInterface.ORIENTATION_NORMAL
                val deg = when (orient) {
                    ExifInterface.ORIENTATION_ROTATE_90 -> 90f
                    ExifInterface.ORIENTATION_ROTATE_180 -> 180f
                    ExifInterface.ORIENTATION_ROTATE_270 -> 270f
                    else -> 0f
                }
                if (deg == 0f) return bmp
                val mx = Matrix().apply { postRotate(deg) }
                return Bitmap.createBitmap(bmp, 0, 0, bmp.width, bmp.height, mx, true)
            }

            /** Tăng tương phản + phóng to + cắt giữa: cứu các ảnh QR mờ / nhỏ / nghiêng */
            private fun enhance(src: Bitmap, contrast: Float, cropRatio: Float): Bitmap {
                val cw = (src.width * cropRatio).toInt().coerceAtLeast(64)
                val ch = (src.height * cropRatio).toInt().coerceAtLeast(64)
                val x = (src.width - cw) / 2
                val y = (src.height - ch) / 2
                val scale = if (max(cw, ch) < 1600) 2f else 1f
                val ow = (cw * scale).toInt()
                val oh = (ch * scale).toInt()
                val out = Bitmap.createBitmap(ow, oh, Bitmap.Config.ARGB_8888)
                val t = (-0.5f * contrast + 0.5f) * 255f
                val cm = ColorMatrix().apply { setSaturation(0f) }
                cm.postConcat(
                    ColorMatrix(
                        floatArrayOf(
                            contrast, 0f, 0f, 0f, t,
                            0f, contrast, 0f, 0f, t,
                            0f, 0f, contrast, 0f, t,
                            0f, 0f, 0f, 1f, 0f
                        )
                    )
                )
                val paint = Paint(Paint.FILTER_BITMAP_FLAG).apply { colorFilter = ColorMatrixColorFilter(cm) }
                Canvas(out).drawBitmap(src, Rect(x, y, x + cw, y + ch), Rect(0, 0, ow, oh), paint)
                return out
            }

            // ---------- Màn hình kết quả ----------
            private fun dp(v: Float): Float = v * resources.displayMetrics.density

            private fun showResult(info: CccdInfo) {
                overlay.setActive(false)
                backCallback.isEnabled = true

                findViewById<TextView>(R.id.tvCccd).text = CccdParser.groupNumber(info.cccd)
                findViewById<TextView>(R.id.tvName).text = info.name.uppercase()
                findViewById<TextView>(R.id.tvDob).text = CccdParser.formatDate(info.dob)
                findViewById<TextView>(R.id.tvGender).text = if (info.gender.isBlank()) "—" else info.gender
                findViewById<TextView>(R.id.tvIssue).text = CccdParser.formatDate(info.issueDate)
                findViewById<TextView>(R.id.tvCmnd).text = if (info.cmnd.isBlank()) "Không có" else info.cmnd
                findViewById<TextView>(R.id.tvAddress).text = if (info.address.isBlank()) "—" else info.address
                val age = CccdParser.age(info.dob)
                findViewById<TextView>(R.id.tvAge).text = if (age != null) "$age tuổi" else "—"
                findViewById<TextView>(R.id.tvBirthPlace).text = CccdParser.birthPlace(info.cccd)

                resultRoot.animate().cancel()
                resultRoot.alpha = 0f
                resultRoot.visibility = View.VISIBLE
                resultRoot.animate().alpha(1f).setDuration(220).start()
                resultScroll.scrollTo(0, 0)

                val parts = listOf<View>(
                    findViewById(R.id.resultHeader),
                    findViewById(R.id.cardMain),
                    findViewById(R.id.cardExtra),
                    findViewById(R.id.footerBox),
                    findViewById(R.id.bottomBar)
                )
                parts.forEachIndexed { i, v ->
                    v.animate().cancel()
                    v.alpha = 0f
                    v.translationY = dp(28f)
                    v.animate().alpha(1f).translationY(0f)
                        .setStartDelay(60L + i * 70L)
                        .setDuration(340)
                        .setInterpolator(DecelerateInterpolator())
                        .start()
                }
            }

            private fun backToScan() {
                backCallback.isEnabled = false
                resultRoot.animate().cancel()
                resultRoot.animate().alpha(0f).setDuration(160).withEndAction {
                    resultRoot.visibility = View.GONE
                    startScanning()
                }.start()
            }

            // ---------- Sao chép / chia sẻ ----------
            private fun buildText(i: CccdInfo): String = listOf(
                "Số CCCD: " + i.cccd,
                "Họ và tên: " + i.name,
                "Ngày sinh: " + CccdParser.formatDate(i.dob),
                "Giới tính: " + i.gender,
                "Ngày cấp: " + CccdParser.formatDate(i.issueDate),
                "Số CMND cũ: " + (if (i.cmnd.isBlank()) "Không có" else i.cmnd),
                "Nơi thường trú: " + i.address
            ).joinToString("\n")

            private fun copyText(text: String, msg: String) {
                val cm = getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
                cm.setPrimaryClip(ClipData.newPlainText("CCCD", text))
                toast(msg)
            }

            private fun shareText(text: String) {
                val i = Intent(Intent.ACTION_SEND).apply {
                    type = "text/plain"
                    putExtra(Intent.EXTRA_TEXT, text)
                }
                startActivity(Intent.createChooser(i, "Chia sẻ thông tin"))
            }

            private fun toast(msg: String) = Toast.makeText(this, msg, Toast.LENGTH_SHORT).show()

            // ---------- Cập nhật ứng dụng ----------
            private fun startUpdate() {
                if (Build.VERSION.SDK_INT >= 26 && !packageManager.canRequestPackageInstalls()) {
                    toast("Hãy bật quyền cài ứng dụng từ nguồn này, rồi bấm cập nhật lại")
                    startActivity(Intent(Settings.ACTION_MANAGE_UNKNOWN_APP_SOURCES, Uri.parse("package:$packageName")))
                    return
                }
                val dir = getExternalFilesDir(Environment.DIRECTORY_DOWNLOADS) ?: filesDir
                val old = File(dir, "update.apk")
                if (old.exists()) old.delete()

                val request = DownloadManager.Request(Uri.parse(UPDATE_URL))
                    .setTitle("Cập nhật CCCD Scanner")
                    .setDestinationInExternalFilesDir(this, Environment.DIRECTORY_DOWNLOADS, "update.apk")
                    .setNotificationVisibility(DownloadManager.Request.VISIBILITY_VISIBLE_NOTIFY_COMPLETED)
                val dm = getSystemService(Context.DOWNLOAD_SERVICE) as DownloadManager
                val id = dm.enqueue(request)

                downloadReceiver?.let { try { unregisterReceiver(it) } catch (e: Exception) {} }
                val receiver = object : BroadcastReceiver() {
                    override fun onReceive(context: Context, intent: Intent) {
                        if (intent.getLongExtra(DownloadManager.EXTRA_DOWNLOAD_ID, -1L) != id) return
                        installApk()
                    }
                }
                downloadReceiver = receiver
                ContextCompat.registerReceiver(
                    this, receiver, IntentFilter(DownloadManager.ACTION_DOWNLOAD_COMPLETE), ContextCompat.RECEIVER_EXPORTED
                )
                toast("Đang tải bản cập nhật...")
            }

            private fun installApk() {
                val dir = getExternalFilesDir(Environment.DIRECTORY_DOWNLOADS) ?: filesDir
                val file = File(dir, "update.apk")
                if (!file.exists() || file.length() < 100_000L) {
                    toast("Tải cập nhật thất bại")
                    return
                }
                val uri = FileProvider.getUriForFile(this, "$packageName.fileprovider", file)
                val i = Intent(Intent.ACTION_VIEW).apply {
                    setDataAndType(uri, "application/vnd.android.package-archive")
                    addFlags(Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_GRANT_READ_URI_PERMISSION)
                }
                startActivity(i)
            }
        }
        EOF

    # ------------------------------------------------------------------
    # 4) BUILD + PHÁT HÀNH
    # ------------------------------------------------------------------
    - name: Setup Gradle (có cache, build nhanh hơn)
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.4'

    - name: Build APK File
      run: gradle assembleDebug --stacktrace

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk

    # Tạo Release để nút "Tải bản cập nhật" trong app hoạt động
    - name: Publish Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v13.${{ github.run_number }}
        name: CCCD Scanner V13 (build ${{ github.run_number }})
        files: app/build/outputs/apk/debug/app-debug.apk
        make_latest: true
