name: Build Android APK V9

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Khôi phục và Lưu trữ Chữ ký (Bảo vệ Cài đè)
      uses: actions/cache@v4
      with:
        path: ~/.android/debug.keystore
        key: android-debug-keystore-v1

    - name: Create Project Files
      run: |
        mkdir -p app/src/main/java/com/example/cccdscanner
        mkdir -p app/src/main/res/layout
        mkdir -p app/src/main/res/drawable
        mkdir -p app/src/main/res/xml

        cat << 'EOF' > gradle.properties
        android.useAndroidX=true
        android.enableJetifier=true
        org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
        EOF

        cat << 'EOF' > settings.gradle.kts
        pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
        dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
        rootProject.name = "CCCDScannerV9"
        include(":app")
        EOF

        cat << 'EOF' > build.gradle.kts
        plugins {
            id("com.android.application") version "8.2.2" apply false
            id("org.jetbrains.kotlin.android") version "1.9.22" apply false
        }
        EOF

        cat << 'EOF' > app/build.gradle.kts
        plugins {
            id("com.android.application")
            id("org.jetbrains.kotlin.android")
        }
        android {
            namespace = "com.example.cccdscanner"
            compileSdk = 34
            defaultConfig {
                applicationId = "com.example.cccdscanner"
                minSdk = 24
                targetSdk = 34
                versionCode = 9
                versionName = "9.0 Pro"
            }
            compileOptions {
                sourceCompatibility = JavaVersion.VERSION_17
                targetCompatibility = JavaVersion.VERSION_17
            }
            kotlinOptions { jvmTarget = "17" }
        }
        dependencies {
            implementation("androidx.core:core-ktx:1.12.0")
            implementation("androidx.appcompat:appcompat:1.6.1")
            implementation("com.google.android.material:material:1.11.0")
            implementation("androidx.constraintlayout:constraintlayout:2.1.4")
            val camerax_version = "1.3.1"
            implementation("androidx.camera:camera-core:${camerax_version}")
            implementation("androidx.camera:camera-camera2:${camerax_version}")
            implementation("androidx.camera:camera-lifecycle:${camerax_version}")
            implementation("androidx.camera:camera-view:${camerax_version}")
            implementation("com.google.mlkit:barcode-scanning:17.3.0")
            implementation("androidx.activity:activity-ktx:1.8.2")
        }
        EOF

        cat << 'EOF' > app/src/main/res/xml/file_paths.xml
        <?xml version="1.0" encoding="utf-8"?>
        <paths>
            <external-cache-path name="external_camera_images" path="/" />
            <cache-path name="internal_camera_images" path="/" />
            <external-files-path name="my_downloads" path="Download/" />
            <external-path name="external_files" path="." />
        </paths>
        EOF

        cat << 'EOF' > app/src/main/res/drawable/bg_cccd_card.xml
        <?xml version="1.0" encoding="utf-8"?>
        <shape xmlns:android="http://schemas.android.com/apk/res/android">
            <gradient android:startColor="#ffffff" android:endColor="#e0f7fa" android:angle="135"/>
            <corners android:radius="16dp"/>
            <stroke android:width="1dp" android:color="#b2ebf2"/>
        </shape>
        EOF

        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.CAMERA" />
            <uses-permission android:name="android.permission.INTERNET" />
            <uses-feature android:name="android.hardware.camera" android:required="true" />
            <uses-feature android:name="android.hardware.camera.autofocus" />
            
            <application
                android:allowBackup="true"
                android:label="CCCD Pro Max"
                android:theme="@style/Theme.AppCompat.Light.NoActionBar">
                
                <provider
                    android:name="androidx.core.content.FileProvider"
                    android:authorities="${applicationId}.fileprovider"
                    android:exported="false"
                    android:grantUriPermissions="true">
                    <meta-data
                        android:name="android.support.FILE_PROVIDER_PATHS"
                        android:resource="@xml/file_paths" />
                </provider>

                <activity android:name=".MainActivity" android:exported="true" android:screenOrientation="portrait">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF

        cat << 'EOF' > app/src/main/res/layout/activity_main.xml
        <?xml version="1.0" encoding="utf-8"?>
        <FrameLayout xmlns:android="http://schemas.android.com/apk/res/android"
            android:layout_width="match_parent" android:layout_height="match_parent"
            android:background="#000000">

            <androidx.camera.view.PreviewView
                android:id="@+id/viewFinder"
                android:layout_width="match_parent"
                android:layout_height="match_parent" />

            <!-- Khung HUD quét toàn màn hình mới -->
            <com.example.cccdscanner.ScannerOverlayView
                android:id="@+id/overlayView"
                android:layout_width="match_parent"
                android:layout_height="match_parent" />

            <Button
                android:id="@+id/btnUpdate"
                android:layout_width="wrap_content"
                android:layout_height="wrap_content"
                android:layout_gravity="top|end"
                android:layout_margin="16dp"
                android:text="🔄 Tải File Cập Nhật"
                android:textSize="12sp"
                android:backgroundTint="#d32f2f"
                android:textColor="#ffffff"
                android:elevation="10dp"/>

            <!-- Sửa text cho đúng tinh thần toàn màn hình -->
            <TextView
                android:layout_width="wrap_content"
                android:layout_height="wrap_content"
                android:text="QUÉT TOÀN MÀN HÌNH\nĐưa mã QR vào bất kỳ vị trí nào"
                android:textAlignment="center"
                android:textColor="#00E676"
                android:textStyle="bold"
                android:textSize="16sp"
                android:layout_gravity="center_horizontal"
                android:layout_marginTop="80dp"
                android:shadowColor="#000000"
                android:shadowRadius="10" />

            <LinearLayout
                android:layout_width="match_parent"
                android:layout_height="wrap_content"
                android:layout_gravity="bottom"
                android:orientation="horizontal"
                android:weightSum="2"
                android:padding="20dp"
                android:background="#80000000">
                <Button android:id="@+id/btnGallery" android:layout_width="0dp" android:layout_height="60dp" android:layout_weight="1" android:layout_marginEnd="10dp" android:text="🖼️ Chọn Ảnh" android:backgroundTint="#424242" android:textColor="#ffffff" android:textStyle="bold"/>
                <Button android:id="@+id/btnCapture" android:layout_width="0dp" android:layout_height="60dp" android:layout_weight="1" android:layout_marginStart="10dp" android:text="📸 Chụp Quét" android:backgroundTint="#0068ff" android:textColor="#ffffff" android:textStyle="bold"/>
            </LinearLayout>

            <ScrollView android:id="@+id/resultLayout" android:layout_width="match_parent" android:layout_height="match_parent" android:background="#f4f5f7" android:visibility="gone">
                <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="vertical" android:padding="20dp">
                    <TextView android:layout_width="match_parent" android:layout_height="wrap_content" android:text="Thông Tin Công Dân" android:textSize="22sp" android:textStyle="bold" android:textColor="#0068ff" android:gravity="center" android:layout_marginBottom="20dp"/>
                    <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="vertical" android:background="@drawable/bg_cccd_card" android:padding="20dp" android:elevation="8dp">
                        <RelativeLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:layout_marginBottom="15dp">
                            <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="Số CCCD" android:textSize="12sp" android:textColor="#757575"/>
                            <TextView android:id="@+id/tvCccd" android:layout_width="wrap_content" android:layout_height="wrap_content" android:layout_marginTop="16dp" android:text="0790..." android:textSize="24sp" android:textStyle="bold" android:textColor="#000000"/>
                            <LinearLayout android:layout_width="wrap_content" android:layout_height="wrap_content" android:layout_alignParentEnd="true" android:orientation="vertical" android:gravity="end">
                                <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="🛡️ Bản quyền:" android:textSize="10sp" android:textColor="#d32f2f" android:textStyle="bold"/>
                                <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="trandoconghuy@gmail.com" android:textSize="10sp" android:textColor="#1976d2" android:textStyle="italic"/>
                            </LinearLayout>
                        </RelativeLayout>
                        <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="Số CMND cũ:" android:textSize="12sp" android:textColor="#757575"/>
                        <TextView android:id="@+id/tvCmnd" android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="---" android:textSize="16sp" android:textColor="#333333" android:layout_marginBottom="10dp"/>
                        <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="Họ và tên:" android:textSize="12sp" android:textColor="#757575"/>
                        <TextView android:id="@+id/tvName" android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="---" android:textSize="20sp" android:textStyle="bold" android:textColor="#000000" android:layout_marginBottom="10dp"/>
                        <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="horizontal" android:layout_marginBottom="10dp">
                            <LinearLayout android:layout_width="0dp" android:layout_height="wrap_content" android:layout_weight="1" android:orientation="vertical">
                                <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="Giới tính:" android:textSize="12sp" android:textColor="#757575"/>
                                <TextView android:id="@+id/tvGender" android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="---" android:textSize="16sp" android:textColor="#333333"/>
                            </LinearLayout>
                            <LinearLayout android:layout_width="0dp" android:layout_height="wrap_content" android:layout_weight="1" android:orientation="vertical">
                                <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="Ngày sinh:" android:textSize="12sp" android:textColor="#757575"/>
                                <TextView android:id="@+id/tvDob" android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="---" android:textSize="16sp" android:textColor="#333333"/>
                            </LinearLayout>
                        </LinearLayout>
                        <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="Nơi thường trú:" android:textSize="12sp" android:textColor="#757575"/>
                        <TextView android:id="@+id/tvAddress" android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="---" android:textSize="16sp" android:textColor="#333333"/>
                    </LinearLayout>
                    <Button android:id="@+id/btnScanAgain" android:layout_width="match_parent" android:layout_height="54dp" android:layout_marginTop="30dp" android:text="🔄 Quét mã khác" android:backgroundTint="#0068ff" android:textColor="#ffffff" android:textStyle="bold"/>
                </LinearLayout>
            </ScrollView>
        </FrameLayout>
        EOF

        cat << 'EOF' > app/src/main/java/com/example/cccdscanner/MainActivity.kt
        package com.example.cccdscanner
        import android.Manifest
        import android.content.Context
        import android.content.Intent
        import android.content.pm.PackageManager
        import android.graphics.*
        import android.media.AudioManager
        import android.media.ToneGenerator
        import android.net.Uri
        import android.os.Bundle
        import android.util.AttributeSet
        import android.view.View
        import android.widget.Button
        import android.widget.ScrollView
        import android.widget.TextView
        import android.widget.Toast
        import androidx.activity.result.contract.ActivityResultContracts
        import androidx.appcompat.app.AppCompatActivity
        import androidx.camera.core.*
        import androidx.camera.core.resolutionselector.AspectRatioStrategy
        import androidx.camera.core.resolutionselector.ResolutionSelector
        import androidx.camera.lifecycle.ProcessCameraProvider
        import androidx.camera.view.PreviewView
        import androidx.core.content.ContextCompat
        import androidx.core.content.FileProvider
        import com.google.mlkit.vision.barcode.BarcodeScannerOptions
        import com.google.mlkit.vision.barcode.BarcodeScanning
        import com.google.mlkit.vision.barcode.common.Barcode
        import com.google.mlkit.vision.common.InputImage
        import java.io.File
        import java.util.concurrent.ExecutorService
        import java.util.concurrent.Executors

        // Lớp vẽ HUD Toàn Màn Hình Không Góc Tối
        class ScannerOverlayView(context: Context, attrs: AttributeSet?) : View(context, attrs) {
            private val strokePaint = Paint().apply { color = Color.parseColor("#00E676"); style = Paint.Style.STROKE; strokeWidth = 14f; strokeCap = Paint.Cap.ROUND }
            override fun onDraw(canvas: Canvas) {
                super.onDraw(canvas)
                val w = width.toFloat(); val h = height.toFloat()
                val pad = 60f; val c = 120f
                canvas.drawLine(pad, pad, pad + c, pad, strokePaint); canvas.drawLine(pad, pad, pad, pad + c, strokePaint)
                canvas.drawLine(w - pad, pad, w - pad - c, pad, strokePaint); canvas.drawLine(w - pad, pad, w - pad, pad + c, strokePaint)
                canvas.drawLine(pad, h - pad, pad + c, h - pad, strokePaint); canvas.drawLine(pad, h - pad, pad, h - pad - c, strokePaint)
                canvas.drawLine(w - pad, h - pad, w - pad - c, h - pad, strokePaint); canvas.drawLine(w - pad, h - pad, w - pad, h - pad - c, strokePaint)
            }
        }

        class MainActivity : AppCompatActivity() {
            private lateinit var viewFinder: PreviewView
            private lateinit var resultLayout: ScrollView
            private lateinit var cameraExecutor: ExecutorService
            private var cameraProvider: ProcessCameraProvider? = null
            private var isScanning = true
            private var currentPhotoUri: Uri? = null

            private val scanner = BarcodeScanning.getClient(BarcodeScannerOptions.Builder().setBarcodeFormats(Barcode.FORMAT_QR_CODE).build())

            private val pickImageLauncher = registerForActivityResult(ActivityResultContracts.GetContent()) { uri: Uri? ->
                if (uri != null) processImageFromUri(uri) else { isScanning = true; startCamera() }
            }

            private val takePictureLauncher = registerForActivityResult(ActivityResultContracts.TakePicture()) { success ->
                if (success && currentPhotoUri != null) {
                    processImageFromUri(currentPhotoUri!!)
                } else {
                    Toast.makeText(this, "Đã hủy chụp ảnh", Toast.LENGTH_SHORT).show()
                    isScanning = true; startCamera()
                }
            }

            private val reqPerm = registerForActivityResult(ActivityResultContracts.RequestPermission()) { if (it) startCamera() }

            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                setContentView(R.layout.activity_main)
                viewFinder = findViewById(R.id.viewFinder)
                resultLayout = findViewById(R.id.resultLayout)
                cameraExecutor = Executors.newSingleThreadExecutor()

                findViewById<Button>(R.id.btnGallery).setOnClickListener {
                    isScanning = false
                    cameraProvider?.unbindAll() 
                    pickImageLauncher.launch("image/*")
                }

                findViewById<Button>(R.id.btnCapture).setOnClickListener {
                    try {
                        isScanning = false
                        cameraProvider?.unbindAll() 
                        val safeCacheDir = externalCacheDir ?: cacheDir
                        val photoFile = File(safeCacheDir, "scan_${System.currentTimeMillis()}.jpg")
                        currentPhotoUri = FileProvider.getUriForFile(this, "${packageName}.fileprovider", photoFile)
                        takePictureLauncher.launch(currentPhotoUri)
                    } catch (e: Exception) {
                        Toast.makeText(this, "Lỗi tạo file ảnh tạm thời", Toast.LENGTH_SHORT).show()
                        isScanning = true; startCamera()
                    }
                }

                findViewById<Button>(R.id.btnScanAgain).setOnClickListener {
                    resultLayout.visibility = View.GONE
                    isScanning = true; startCamera()
                }

                findViewById<Button>(R.id.btnUpdate).setOnClickListener {
                    Toast.makeText(this, "Đang mở trang tải File Artifacts...", Toast.LENGTH_LONG).show()
                    val githubActionsUrl = "https://github.com/trandoconghuy/thutuchanhchinh/actions"
                    startActivity(Intent(Intent.ACTION_VIEW, Uri.parse(githubActionsUrl)))
                }

                if (ContextCompat.checkSelfPermission(this, Manifest.permission.CAMERA) == PackageManager.PERMISSION_GRANTED) startCamera()
                else reqPerm.launch(Manifest.permission.CAMERA)
            }

            private fun startCamera() {
                val providerFuture = ProcessCameraProvider.getInstance(this)
                providerFuture.addListener({
                    cameraProvider = providerFuture.get()
                    val preview = Preview.Builder().build().also { it.setSurfaceProvider(viewFinder.surfaceProvider) }
                    
                    // SỬ DỤNG CHIẾN LƯỢC QUÉT TOÀN MÀN HÌNH (GÓC RỘNG NHẤT TỈ LỆ 16:9)
                    val resolutionSelector = ResolutionSelector.Builder()
                        .setAspectRatioStrategy(AspectRatioStrategy.RATIO_16_9_FALLBACK_AUTO_STRATEGY)
                        .build()

                    val analyzer = ImageAnalysis.Builder()
                        .setBackpressureStrategy(ImageAnalysis.STRATEGY_KEEP_ONLY_LATEST)
                        .setResolutionSelector(resolutionSelector)
                        .build()
                        
                    analyzer.setAnalyzer(cameraExecutor) { proxy ->
                        val mediaImage = proxy.image
                        if (mediaImage != null && isScanning) {
                            val image = InputImage.fromMediaImage(mediaImage, proxy.imageInfo.rotationDegrees)
                            scanner.process(image).addOnSuccessListener { bars ->
                                for (b in bars) {
                                    if (!b.rawValue.isNullOrEmpty() && b.rawValue!!.contains("|")) {
                                        isScanning = false
                                        runOnUiThread { handleSuccess(b.rawValue!!) }
                                        break
                                    }
                                }
                            }.addOnCompleteListener { proxy.close() }
                        } else proxy.close()
                    }
                    try { cameraProvider?.unbindAll(); cameraProvider?.bindToLifecycle(this, CameraSelector.DEFAULT_BACK_CAMERA, preview, analyzer) } catch (e: Exception) {}
                }, ContextCompat.getMainExecutor(this))
            }

            // SỬA LỖI LIỆT NÚT: Đẩy toàn bộ quá trình đọc ảnh vào Luồng Ngầm (Background Thread)
            private fun processImageFromUri(uri: Uri) {
                cameraExecutor.execute {
                    try {
                        val image = InputImage.fromFilePath(this@MainActivity, uri)
                        scanner.process(image)
                            .addOnSuccessListener { barcodes ->
                                if (barcodes.isEmpty()) {
                                    runOnUiThread {
                                        Toast.makeText(this@MainActivity, "Không tìm thấy mã QR CCCD trong ảnh!", Toast.LENGTH_LONG).show()
                                        isScanning = true; startCamera()
                                    }
                                } else {
                                    for (barcode in barcodes) {
                                        if (!barcode.rawValue.isNullOrEmpty() && barcode.rawValue!!.contains("|")) {
                                            runOnUiThread { handleSuccess(barcode.rawValue!!) }
                                            return@addOnSuccessListener
                                        }
                                    }
                                    runOnUiThread {
                                        Toast.makeText(this@MainActivity, "QR không đúng chuẩn CCCD!", Toast.LENGTH_LONG).show()
                                        isScanning = true; startCamera()
                                    }
                                }
                            }.addOnFailureListener {
                                runOnUiThread {
                                    Toast.makeText(this@MainActivity, "Lỗi phân tích AI.", Toast.LENGTH_SHORT).show()
                                    isScanning = true; startCamera()
                                }
                            }
                    } catch (e: Exception) {
                        runOnUiThread {
                            Toast.makeText(this@MainActivity, "Không thể đọc file ảnh dung lượng lớn", Toast.LENGTH_SHORT).show()
                            isScanning = true; startCamera()
                        }
                    }
                }
            }

            private fun handleSuccess(text: String) {
                try { ToneGenerator(AudioManager.STREAM_ALARM, 100).startTone(ToneGenerator.TONE_PROP_BEEP, 150) } catch(e:Exception){}
                cameraProvider?.unbindAll()
                val parts = text.split("|")
                if (parts.size >= 6) {
                    findViewById<TextView>(R.id.tvCccd).text = parts[0]
                    findViewById<TextView>(R.id.tvCmnd).text = parts[1].ifEmpty { "Không có" }
                    findViewById<TextView>(R.id.tvName).text = parts[2]
                    findViewById<TextView>(R.id.tvDob).text = parts[3].let { if (it.length == 8) "${it.substring(0,2)}/${it.substring(2,4)}/${it.substring(4,8)}" else it }
                    findViewById<TextView>(R.id.tvGender).text = parts[4]
                    findViewById<TextView>(R.id.tvAddress).text = parts[5]
                }
                resultLayout.visibility = View.VISIBLE
            }
        }
        EOF

    - name: Build APK File
      run: |
        gradle wrapper --gradle-version 8.4
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
